function drawTimeline(){
  TL_TIPS=[];
  const dayStart=new Date(tlDate), dayEnd=new Date(tlDate); dayEnd.setDate(dayEnd.getDate()+1);
  const {sessions}=pairSessions(t=>{ const e=new Date(t); return e>=dayStart && e<dayEnd; });
  const isToday=tlDate.toDateString()===new Date().toDateString();

  const byWorker={};
  sessions.forEach(s=>{ (byWorker[s.worker]=byWorker[s.worker]||[]).push(s); });
  const names=(workers||[]).map(w=>w.name);
  Object.keys(byWorker).forEach(n=>{ if(!names.includes(n)) names.push(n); });

  const rows=names.map(name=>{
    const hrs=tlHoursFor(name);
    const list=(byWorker[name]||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
    let lo=hrs.start, hi=hrs.end;
    list.forEach(s=>{
      const a=new Date(s.start), b=new Date(s.end);
      lo=Math.min(lo, a.getHours()*60+a.getMinutes());
      hi=Math.max(hi, b.getHours()*60+b.getMinutes());
    });
    lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60;
    const span=Math.max(hi-lo,60);
    let workedMs=0;
    const segs=list.map((s,idx)=>{
      const a=new Date(s.start), b=new Date(s.end);
      const m0=a.getHours()*60+a.getMinutes(), m1=b.getHours()*60+b.getMinutes();
      workedMs+=s.ms;
      const name0=s.item_desc&&s.item_desc!==s.item_id?s.item_desc:s.item_id;
      const tip='<strong>'+esc(name0)+'</strong>'
        +'<br><span style="opacity:.75">'+esc(s.item_id)+'</span>'
        +(s.customer&&s.customer!=='undefined'?'<br><span style="opacity:.75">'+esc(s.customer)+'</span>':'')
        +'<br>'+esc(s.role||'—')
        +'<br>'+tlFmt(m0)+' – '+tlFmt(m1)+'  ('+tlDur(m1-m0)+')'
        +(s.runaway?'<br><span style="color:#fca5a5">⚠️ left running</span>':'')
        +'<br><span style="opacity:.6;font-size:11px">tap to open item</span>';
      return { s, n:idx+1, name:name0, left:((m0-lo)/span)*100,
               width:Math.max(((m1-m0)/span)*100,0.8), m0, m1, mins:m1-m0, tip };
    });

    // Idle stretches
    const merged=[];
    segs.map(g=>[g.m0,g.m1]).sort((a,b)=>a[0]-b[0]).forEach(b=>{
      const last=merged[merged.length-1];
      if(last && b[0]<=last[1]) last[1]=Math.max(last[1],b[1]); else merged.push([...b]);
    });
    const gaps=[]; let cursor=lo;
    merged.forEach(([a,b])=>{ if(a>cursor) gaps.push([cursor,a]); cursor=Math.max(cursor,b); });
    if(cursor<hi) gaps.push([cursor,hi]);
    const gapObjs=gaps.filter(([a,b])=>b-a>=5).map(([a,b])=>({
      left:((a-lo)/span)*100, width:((b-a)/span)*100, mins:b-a,
      tip:'<strong>No work recorded</strong><br>'+tlFmt(a)+' – '+tlFmt(b)+'  ('+tlDur(b-a)+')'
        +((a<hrs.start||b>hrs.end)?'<br><span style="opacity:.7">outside shift hours</span>':'')
    }));
    return {name, hrs, lo, hi, span, segs, gaps:gapObjs, workedMs, list};
  }).filter(r=>r.segs.length || (workers||[]).some(w=>w.name===r.name));

  const iso=tlDate.getFullYear()+'-'+String(tlDate.getMonth()+1).padStart(2,'0')+'-'+String(tlDate.getDate()).padStart(2,'0');

  let html=`
  <div class="page-head">
    <div><div class="page-title">Day Timeline</div><div class="page-sub">${tlDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div></div>
    <div class="head-actions">
      <button class="btn btn-ghost btn-sm" onclick="tlShiftDay(-1)">‹ Prev</button>
      <input type="date" value="${iso}" onchange="tlPickDate(this.value)" style="max-width:165px">
      <button class="btn btn-ghost btn-sm" ${isToday?'disabled style="opacity:.3"':''} onclick="tlShiftDay(1)">Next ›</button>
      ${isToday?'':'<button class="btn btn-sm" onclick="tlToday()">Today</button>'}
    </div>
  </div>`;

  window._tlNames=rows.map(r=>r.name);
  if(rows.length){
    const totalMs=rows.reduce((a,r)=>a+r.workedMs,0);
    const totalJobs=rows.reduce((a,r)=>a+r.segs.length,0);
    const active=rows.filter(r=>r.segs.length).length;
    html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 16px">
      <div style="font-size:13px;color:var(--ink2)">
        <strong>${active}</strong> of ${rows.length} worked · <strong>${totalJobs}</strong> job${totalJobs!==1?'s':''} · <strong>${fmtDur(totalMs)}</strong> hands-on
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn btn-ghost btn-sm" onclick="tlExpandAll()">Expand all</button>
        <button class="btn btn-ghost btn-sm" onclick="tlCollapseAll()">Collapse all</button>
      </div>
    </div>`;
  }

  if(!rows.length){ html+='<div class="card"><div class="empty">No workers or no scans for this day</div></div>'; }

  html+=rows.map(r=>{
    const shiftMins=Math.max(r.hrs.end-r.hrs.start,1);
    const workedMin=Math.round(r.workedMs/60000);
    const pct=r.hrs.off?0:Math.min(Math.round(workedMin/shiftMins*100),100);
    const idle=Math.max(shiftMins-workedMin,0);
    const pctCol=pct>=70?'var(--green)':(pct>=40?'var(--orange)':'var(--red)');

    // Hour ruler
    let ruler='';
    for(let m=Math.ceil(r.lo/60)*60; m<=r.hi; m+=60){
      const pos=((m-r.lo)/Math.max(r.hi-r.lo,60))*100;
      ruler+=`<div style="position:absolute;left:${pos}%;top:0;bottom:0;width:1px;background:var(--border)"></div>`;
      ruler+=`<div style="position:absolute;left:${pos}%;bottom:-17px;transform:translateX(-50%);font-size:9.5px;color:var(--ink3);white-space:nowrap">${tlFmt(m)}</div>`;
    }

    // Blocks carry a number, never squeezed text
    const blocks=r.segs.map(g=>{
      const i=TL_TIPS.push(g.tip)-1;
      const wide=g.width>=5;
      return `<div onmousemove="tlTipI(event,${i})" onmouseleave="tlTipHide()"
        onclick="tlTipHide();navigate('${h('item',g.s.item_id).replace(/'/g,"\\'")}')"
        style="position:absolute;left:${g.left}%;width:${g.width}%;top:6px;bottom:6px;background:${tlHue(g.s.role)};
        border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)">
        ${wide?`<span style="color:#fff;font-size:10px;font-weight:800">${g.n}</span>`:''}
      </div>`;
    }).join('');
    const gapDivs=r.gaps.map(gp=>{
      const i=TL_TIPS.push(gp.tip)-1;
      return `<div onmousemove="tlTipI(event,${i})" onmouseleave="tlTipHide()" onclick="tlTipI(event,${i})"
        style="position:absolute;left:${gp.left}%;width:${gp.width}%;top:6px;bottom:6px;cursor:help"></div>`;
    }).join('');

    const isOpen=tlOpen.has(r.name);
    return `<div class="card" style="padding:14px 16px;margin-bottom:10px">
      <div class="clickable" onclick="tlToggle('${jsstr(r.name)}')"
        style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:${isOpen?'12px':'8px'}">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <span style="color:var(--ink3);font-size:12px;width:12px;flex-shrink:0">${isOpen?'▾':'▸'}</span>
          <span style="width:30px;height:30px;border-radius:50%;background:${pctCol};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0">${esc(r.name).trim().charAt(0).toUpperCase()}</span>
          <div style="min-width:0">
            <div style="font-family:'Outfit',sans-serif;font-size:15.5px;font-weight:700">${esc(r.name)}</div>
            <div style="font-size:11px;color:var(--ink3)">${r.hrs.off?'<span style="color:var(--ink3);font-style:italic">scheduled off</span> · ':''}${r.segs.length} job${r.segs.length!==1?'s':''} · worked ${fmtDur(r.workedMs)}${r.hrs.off?'':' · idle '+tlDur(idle)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="text-align:right">
            <div style="font-family:'Outfit',sans-serif;font-size:19px;font-weight:800;color:${r.hrs.off?'var(--ink3)':pctCol};line-height:1">${r.hrs.off?'—':pct+'%'}</div>
            <div style="font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em">${r.hrs.off?'day off':'of shift'}</div>
          </div>
        </div>
      </div>

      <div style="position:relative;height:${isOpen?'40px':'26px'};background:var(--surface2);border-radius:${isOpen?'8px':'6px'};margin-bottom:${isOpen?'24px':'0'}">
        ${isOpen?ruler:''}${gapDivs}${blocks}
      </div>
      ${isOpen?'':`<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink3);margin-top:3px"><span>${tlFmt(r.lo)}</span><span>${tlFmt(r.hi)}</span></div>`}
      ${isOpen?'':''}

      ${!isOpen?'':(()=>{
        if(!r.segs.length) return '<div style="font-size:12.5px;color:var(--ink3);font-style:italic">Nothing recorded this day</div>';
        // Route view: the day as turn-by-turn steps, with the waits shown between them
        const steps=[];
        r.segs.forEach((g,idx)=>{
          steps.push({kind:'work', g});
          const next=r.segs[idx+1];
          if(next && next.m0-g.m1>=10) steps.push({kind:'wait', from:g.m1, to:next.m0});
        });
        return `<div style="position:relative;padding-left:6px">
          ${steps.map((st,si)=>{
            const last=si===steps.length-1;
            if(st.kind==='wait'){
              return `<div style="display:flex;gap:12px;align-items:stretch">
                <div style="width:16px;display:flex;flex-direction:column;align-items:center">
                  <div style="flex:1;width:2px;background:repeating-linear-gradient(180deg,var(--border) 0 4px,transparent 4px 9px)"></div>
                </div>
                <div style="padding:7px 0 7px 2px;font-size:11.5px;color:var(--ink3);font-style:italic">
                  waiting ${tlDur(st.to-st.from)} · ${tlFmt(st.from)}–${tlFmt(st.to)}</div>
              </div>`;
            }
            const g=st.g, col=tlHue(g.s.role);
            return `<div style="display:flex;gap:12px;align-items:stretch">
              <div style="width:16px;display:flex;flex-direction:column;align-items:center;flex-shrink:0">
                <div style="width:15px;height:15px;border-radius:50%;background:${col};color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${g.n}</div>
                ${last?'':`<div style="flex:1;width:2px;background:${col};opacity:.35;min-height:14px"></div>`}
              </div>
              <div class="clickable" onclick="navigate('${h('item',g.s.item_id).replace(/'/g,"\\'")}')"
                style="flex:1;min-width:0;padding:2px 0 14px">
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
                  <div style="min-width:0">
                    <div style="font-weight:700;font-size:14px;line-height:1.25">${esc(g.name)}</div>
                    <div style="font-size:11.5px;color:var(--ink3);margin-top:1px">
                      <span style="color:${col};font-weight:700">${esc(g.s.role||'—')}</span> · ${tlFmt(g.m0)} – ${tlFmt(g.m1)}
                    </div>
                  </div>
                  <span style="font-size:12.5px;font-weight:800;color:var(--gold2);white-space:nowrap">${tlDur(g.mins)}</span>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      })()}
    </div>`;
  }).join('');

  html+=tlScheduleCard();
  document.getElementById('content').innerHTML=html;
}

          ${TL_DAYS.map(([k,lbl])=>{
            const d=sched[k]||{};
            return `<div style="display:flex;align-items:center;gap:7px;background:var(--surface2);padding:7px 10px;border-radius:8px">
              <span style="width:34px;font-size:12px;font-weight:700">${lbl}</span>
              <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3)">
                <input class="tl-hrs" data-worker="${esc(w.name)}" data-day="${k}" data-k="off" type="checkbox" ${d.off?'checked':''} style="width:14px;height:14px"> off</label>
              <input class="tl-hrs" data-worker="${esc(w.name)}" data-day="${k}" data-k="start" type="time" value="${d.start||TL_DEFAULT.start}" style="width:96px;padding:5px;font-size:12px">
              <input class="tl-hrs" data-worker="${esc(w.name)}" data-day="${k}" data-k="end" type="time" value="${d.end||TL_DEFAULT.end}" style="width:96px;padding:5px;font-size:12px">

    <button class="btn btn-gold btn-sm" style="margin-top:12px" onclick="tlSaveHours()">Save Schedule</button>

  </div>`;
}

function closeScanSearch(){
  const ov=document.getElementById('scan-search-ov'); if(ov) ov.style.display='none';
  try{ if(scanSearchReader&&scanSearchReader.reset) scanSearchReader.reset(); }catch(e){}

  scanSearchReader=null; scanSearchStream=null;
}
function scanSearchMsg(m){ const el=document.getElementById('scan-search-msg'); if(el) el.textContent=m; }
// Same confirmation rule as the worker app: accept only a code read twice
let ssCand=null, ssHits=0;
function ssConfirm(code){
  if(code===ssCand){ ssHits++; if(ssHits>=2) return code; }
  else { ssCand=code; ssHits=1; }
  return null;
}
async function startScanSearch(){
  ssCand=null; ssHits=0;
  const video=document.getElementById('scan-search-video');
  try{
    scanSearchStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=scanSearchStream; await video.play();
  }catch(e){ scanSearchMsg('Camera unavailable — '+(e.message||e)); return; }

  const handle=(raw)=>{
    const code=ssConfirm(String(raw||'').toUpperCase().replace(/\][A-Z][0-9]/g,'').replace(/[^A-Z0-9\-]/g,''));
    if(!code) return;
    const m=code.match(/T-?(\d+)-(\d+)(-[A-Z0-9]+)?/);
    if(!m){ scanSearchMsg('Not a Glint label: '+code.slice(0,24)); ssCand=null; ssHits=0; return; }
    const itemId='T-'+m[1]+'-'+m[2]+(m[3]||'');
    closeScanSearch();
    toast('🔍 '+itemId);
    navigate(h('item', itemId));
  };

  if('BarcodeDetector' in window){
    try{
      const det=new BarcodeDetector({formats:['code_128','code_39','qr_code']});
      const loop=async()=>{
        const ov=document.getElementById('scan-search-ov');
        if(!ov||ov.style.display==='none') return;
        try{ const bc=await det.detect(video); if(bc.length) handle(bc[0].rawValue); }catch(e){}
        setTimeout(loop,200);
      };
      loop(); return;
    }catch(e){}
  }
  if(typeof ZXingBrowser!=='undefined'){
    try{
      scanSearchReader=new ZXingBrowser.BrowserMultiFormatReader();
      scanSearchReader.decodeFromVideoElement(video,(res)=>{ if(res) handle(res.getText?res.getText():res.text); });
      return;
    }catch(e){}
  }
  scanSearchMsg('Barcode scanning not supported on this browser — type the ID instead');
}

// REPAIRDESK STATUS — their status per item, mapped to our pipeline
// ========================================================================
// Real values seen on this account: Delivered · Payment Received & Delivered · Picked up
// · Delivery on way · Scanovator Delivery · Ready · Lacquering · Cleaning · Estimate · Issue …
function rdStatusToStage(name){
  const s=String(name||'').toLowerCase();
  if(!s) return null;
  if(/on way|scanovator|in transit|out for/.test(s)) return 'On Way';   // courier has it, not delivered yet
  if(/deliver|picked up/.test(s)) return 'Delivered';
  if(/pack/.test(s)) return 'Packed';
  if(/ready|done/.test(s)) return 'READY';
  return null;   // in-progress or admin statuses — our own scans are more accurate
}

function prodSet(period){ prodPeriod=period; prodOffset=0; drawProduction(); }
function prodNav(d){ prodOffset+=d; if(prodOffset>0)prodOffset=0; drawProduction(); }
function drawProduction(){
  const {start,end}=prodRange(prodPeriod,prodOffset);
  let {start:pStart,end:pEnd}=prodRange(prodPeriod,prodOffset-1);
  // Comparing a half-finished day against a whole one makes everything look red.
  // For the period in progress, measure the SAME elapsed slice of the previous period.
  const inProgress = prodOffset===0 && Date.now() < end.getTime();
  const elapsed = inProgress ? Math.max(Date.now()-start.getTime(), 0) : (end-start);
  if(inProgress) pEnd=new Date(pStart.getTime()+elapsed);
  const cur=prodMetrics(start,end);
  const prev=prodMetrics(pStart,pEnd);
  const rec=prodRecords(prodPeriod);
  const fraction = inProgress ? Math.min(elapsed/(end-start),1) : 1;
  const pace = fraction>0.02 ? Math.round(cur.pieces/fraction) : null; // projected finish
  const cmpWord = inProgress ? ('same time last '+(prodPeriod==='day'?'day':prodPeriod)) : ('previous '+prodPeriod);
  const hasValue = cur.value>0 || prev.value>0;
  const periodWord=prodPeriod==='day'?'day':(prodPeriod==='month'?'month':'week');

  // Daily bars across the period
  const days=[]; const d=new Date(start);
  while(d<end && days.length<31){ days.push(new Date(d)); d.setDate(d.getDate()+1); }
  const perDay=days.map(day=>{
    const dEnd=new Date(day); dEnd.setDate(dEnd.getDate()+1);
    return prodMetrics(day,dEnd).pieces;
  });
  const maxDay=Math.max(...perDay,1);
  const barW=days.length>14?18:34;
  const todayStr=new Date().toDateString();
  const bars=days.map((day,i)=>{
    const isToday=day.toDateString()===todayStr;
    const hot=perDay[i]===maxDay&&maxDay>0;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">

// Plain-language read of the numbers — the "what am I looking at" line
function prodSummary(cur,prev,rec,pace,inProgress,periodWord,cmpWord,hasValue){
  if(!cur.pieces) return '<strong>Nothing finished yet in this '+periodWord+'.</strong> Pieces appear here once a worker scans out of a stage.';
  const bits=[];
  bits.push(`<strong>${cur.pieces} pieces</strong> ${inProgress?'so far this '+periodWord:'this '+periodWord}` + (hasValue?` · <strong>${fmtMoney(cur.value)}</strong> of work`:''));
  if(prev.pieces){
    const d=cur.pieces-prev.pieces;
    const pct=Math.abs(Math.round(d/prev.pieces*100));
    bits.push(d>=0
      ? `<span style="color:var(--green)">Ahead of the ${cmpWord}</span> (${prev.pieces} then, +${pct}%)`
      : `<span style="color:var(--red)">Behind the ${cmpWord}</span> (${prev.pieces} then, −${pct}%)`);
  }
  if(inProgress && pace) bits.push(`At this pace you'll finish around <strong>${pace}</strong> for the ${periodWord}`);
  if(rec.recTotal) bits.push(`Your best ${periodWord} ever was <strong>${rec.recTotal}</strong>`);
  return bits.join('<br>');
}
function stageValue(m,stage){
  let v=0; const seen={};
  m.sess.forEach(s=>{
    if((s.role||'—')!==stage) return;
    const pk=parentItemId(s.item_id);
    if(seen[pk]) return; seen[pk]=1;
    v+=pieceValue(stage,s.item_id);
  });
  return v;
}
// Value produced by one worker in the period
function workerValue(m,worker){
  let v=0; const seen={};
  m.sess.forEach(s=>{
    if(s.worker!==worker) return;
    const role=s.role||'—';
    const k=role+'::'+parentItemId(s.item_id);
    if(seen[k]) return; seen[k]=1;
    v+=pieceValue(role,s.item_id);
  });
  return v;
}

function renderInsightsBody(){
  const box=document.getElementById('insights-body');
  if(!box) return;
  const {sessions}=pairSessions(insightsInRange);
  if(!sessions.length){ box.innerHTML='<div class="card"><div class="empty">No completed sessions in this range yet</div></div>'; return; }

  // ---- 1. Average time per service (role) ----
  const roleAgg={};
  sessions.forEach(s=>{
    const r=s.role||'—';
    if(!roleAgg[r]) roleAgg[r]={ms:0,count:0};
    roleAgg[r].ms+=s.ms; roleAgg[r].count++;
  });
  const roleRows=Object.entries(roleAgg).map(([r,d])=>({role:r,avg:d.ms/d.count,total:d.ms,count:d.count})).sort((a,b)=>b.avg-a.avg);
  const maxAvgRole=Math.max(...roleRows.map(r=>r.avg),1);

  let html=`<div class="card">
    <div class="card-label">Average Time per Service</div>
    ${roleRows.map(r=>`<div style="padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px">
        <strong>${esc(r.role)}</strong>
        <span>${fmtDur(r.avg)} avg <span style="color:var(--ink3);font-weight:400">· ${r.count} session${r.count!==1?'s':''} · ${fmtDur(r.total)} total</span></span>
      </div>
      <div style="height:7px;background:var(--surface2);border-radius:4px;overflow:hidden"><div style="width:${Math.round(r.avg/maxAvgRole*100)}%;height:100%;background:var(--gold)"></div></div>
    </div>`).join('')}
  </div>`;

  // ---- 2. Fastest workers per service (min 2 sessions per worker+role to avoid single-sample noise) ----
  const workerRoleAgg={}; // role -> worker -> {ms,count}
  sessions.forEach(s=>{
    const r=s.role||'—';
    if(!workerRoleAgg[r]) workerRoleAgg[r]={};
    if(!workerRoleAgg[r][s.worker]) workerRoleAgg[r][s.worker]={ms:0,count:0};
    workerRoleAgg[r][s.worker].ms+=s.ms; workerRoleAgg[r][s.worker].count++;
  });
  html+=`<div class="card">
    <div class="card-label">Fastest Workers by Service <span style="font-weight:600;text-transform:none;color:var(--ink3)">— ranked fastest to slowest, minimum 2 sessions</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
    ${Object.entries(workerRoleAgg).map(([role,workers])=>{
      const ranked=Object.entries(workers).map(([w,d])=>({worker:w,avg:d.ms/d.count,count:d.count})).filter(x=>x.count>=2).sort((a,b)=>a.avg-b.avg);
      if(!ranked.length) return '';
      return `<div>
        <div style="font-size:11px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">${esc(role)}</div>
        ${ranked.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;${i===0?'font-weight:700':''}">
          <span>${i===0?'🥇 ':''}${esc(x.worker)}</span>
          <span style="color:${i===0?'var(--green)':'var(--ink2)'}">${fmtDur(x.avg)} <span style="color:var(--ink3);font-size:11px">(${x.count})</span></span>
        </div>`).join('')}
      </div>`;
    }).filter(Boolean).join('') || '<div class="empty">Not enough repeat data yet — need at least 2 sessions per worker on the same service</div>'}
    </div>
  </div>`;

  // ---- 3. Items that take longest ----
  const itemTypeAgg={};
  let unresolvedCount=0;
  sessions.forEach(s=>{
    const type=normalizeItemType(s.item_desc);
    if(!type){ unresolvedCount++; return; }
    if(!itemTypeAgg[type]) itemTypeAgg[type]={ms:0,count:0};
    itemTypeAgg[type].ms+=s.ms; itemTypeAgg[type].count++;
  });
  const itemRows=Object.entries(itemTypeAgg).map(([t,d])=>({type:t,avg:d.ms/d.count,total:d.ms,count:d.count})).sort((a,b)=>b.avg-a.avg);
  html+=`<div class="card">
    <div class="card-label">Items That Take Longest <span style="font-weight:600;text-transform:none;color:var(--ink3)">— average time per work session, by item type</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Item Type</th><th>Avg per Session</th><th>Total Time</th><th>Sessions</th></tr></thead><tbody>
    ${itemRows.length?itemRows.map(r=>`<tr><td><strong>${esc(r.type)}</strong></td><td>${fmtDur(r.avg)}</td><td>${fmtDur(r.total)}</td><td>${r.count}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No item data yet</td></tr>'}
    </tbody></table></div>
    ${unresolvedCount?`<div style="font-size:11px;color:var(--ink3);margin-top:10px">${unresolvedCount} session${unresolvedCount!==1?'s':''} skipped — item name wasn't recorded (older scans from before the name-resolve fix)</div>`:''}
  </div>`;

  box.innerHTML=html;
}

function renderOrdersList(){
  const q=(document.getElementById('orders-search').value||'').toLowerCase().trim();
  const orders={};
  scans.forEach(s=>{
    const oid=orderIdOf(s.item_id);
    if(!orders[oid]) orders[oid]={items:{}, customer:s.customer, last:s.created_at};
    if(!orders[oid].items[s.item_id]) orders[oid].items[s.item_id]={desc:s.item_desc, events:[]};
    orders[oid].items[s.item_id].events.push(s);
    if(new Date(s.created_at)>new Date(orders[oid].last)) orders[oid].last=s.created_at;
    if(s.customer&&s.customer!=='undefined'&&!orders[oid].customer) orders[oid].customer=s.customer;
  });
  let list=Object.entries(orders).sort((a,b)=>new Date(b[1].last)-new Date(a[1].last));
  if(q) list=list.filter(([oid,o])=>{
    if(oid.toLowerCase().includes(q)||(o.customer||'').toLowerCase().includes(q)) return true;
    return Object.entries(o.items).some(([iid,it])=>iid.toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q)||it.events.some(e=>(e.worker||'').toLowerCase().includes(q)));
  });
  const el=document.getElementById('orders-list');
  if(!list.length){ el.innerHTML='<div class="empty">No orders match</div>'; return; }
  el.innerHTML=list.map(([oid,o])=>{
    const items=Object.entries(o.items);
    let doneCount=0, totalMs=0, anyWorking=false, anyRunaway=false;
    items.forEach(([iid,it])=>{ const a=analyzeItem(it.events); totalMs+=a.ms; if(a.done)doneCount++; if(a.working)anyWorking=true; if(a.hadRunaway)anyRunaway=true; });
    const pct=items.length?Math.round(doneCount/items.length*100):0;
    // Orders not matching our T-#### label format came from scanning a non-Glint barcode
    const isJunk=!/^T-\d+$/i.test(oid);
    const hasName=o.customer&&o.customer!=='undefined';
    return `<div class="card clickable" onclick="navigate('${h('order',oid).replace(/'/g,"\\'")}')"${isJunk?' style="border-color:var(--orange)"':''}>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--gold2)">${esc(oid)}${isJunk?' · <span style="color:var(--orange)">⚠️ NOT A GLINT LABEL</span>':''}${anyWorking?' · <span style="color:var(--green)">● IN PROGRESS</span>':(pct===100?' · <span style="color:var(--ink3)">✓ COMPLETE</span>':'')}</div>
          <div style="font-family:'Outfit',sans-serif;font-size:21px;font-weight:700${hasName?'':';color:var(--ink3)'}">${hasName?esc(o.customer):'Name not recorded'}</div>
          <div style="font-size:11.5px;color:var(--ink3);margin-top:2px">${items.length} item${items.length!==1?'s':''} · ${doneCount} done${anyRunaway?' · <span style="color:var(--orange)">⚠️ includes capped time</span>':''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px;font-weight:700">${doneCount}/${items.length} done</div>
          <div style="font-size:12px;color:var(--gold2);font-weight:700">${fmtDur(totalMs)}</div>
          <div style="width:130px;height:7px;background:var(--surface2);border-radius:4px;margin-top:5px;overflow:hidden;margin-left:auto"><div style="width:${pct}%;height:100%;background:${pct===100?'var(--green)':'var(--gold)'}"></div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function renderOrderDetailPage(oid){
  const el=document.getElementById('content');
  el.innerHTML='<div class="empty">Loading order…</div>';
  // Gather scan data for this order
  const orderScans=scans.filter(s=>orderIdOf(s.item_id)===oid);
  const itemsMap={};
  orderScans.forEach(s=>{ if(!itemsMap[s.item_id]) itemsMap[s.item_id]={desc:s.item_desc, events:[]}; itemsMap[s.item_id].events.push(s); });
  let customer=orderScans.find(s=>s.customer&&s.customer!=='undefined')?.customer || '';

  let totalMs=0, doneCount=0; const items=Object.entries(itemsMap);
  const orderWorkers={};
  items.forEach(([iid,it])=>{
    const a=analyzeItem(it.events); totalMs+=a.ms; if(a.done)doneCount++;
    Object.entries(a.byWorker).forEach(([w,ms])=>{ orderWorkers[w]=(orderWorkers[w]||0)+ms; });
  });
  const pct=items.length?Math.round(doneCount/items.length*100):0;

  // Fetch RepairDesk detail (customer info, service, notes, intake photos)
  let t=null;
  try{ const tid=await resolveTicketId(oid); if(tid){ const d=await fetchViaProxy(`${RD_BASE}/tickets/${tid}?api_key=${RD_KEY}`); if(d&&d.data) t=d.data; } }catch(e){}

  let html=`<div class="page-head"><div><div class="page-title">${esc(oid)}</div><div class="page-sub">${esc(customer||(t?getCustomerName(t):'—'))}</div></div>
    <button class="btn btn-ghost btn-sm" onclick="navigate('${h('orders')}')">← Back to Orders</button></div>`;

  if(t){
    const cust=getCustomerName(t), phone=getCustomerPhone(t), city=getCustomerCity(t), group=getCustomerGroup(t), addr=getCustomerAddress(t), due=getDueDate(t);
    html+=`<div class="card"><div class="card-label">Customer</div>
      <div style="font-size:14px;line-height:1.8"><strong>${esc(cust)}</strong>${phone?' · '+esc(phone):''}<br>
      ${group?'<span style="color:var(--gold2);font-weight:700">Group: '+esc(group)+'</span>':''}${city?(group?' · ':'')+'City: '+esc(city):''}${addr?'<br>'+esc(addr):''}${due?'<br>Due: '+esc(due):''}</div></div>`;
  }

  html+=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div class="card-label" style="margin-bottom:0">Progress</div>
      <div style="font-size:13px;font-weight:700">${doneCount}/${items.length} done · <span style="color:var(--gold2)">${fmtDur(totalMs)} total</span></div>
    </div>
    <div style="height:8px;background:var(--surface2);border-radius:5px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${pct===100?'var(--green)':'var(--gold)'}"></div></div>
    ${Object.keys(orderWorkers).length?`<div style="font-size:12px;color:var(--ink3);margin-top:10px">⏱️ ${Object.entries(orderWorkers).sort((a,b)=>b[1]-a[1]).map(([w,ms])=>esc(w)+' · '+fmtDur(ms)).join('  |  ')}</div>`:''}
  </div>`;

  // Items
  html+='<div class="card"><div class="card-label">Items</div>';
  if(t&&t.devices&&t.devices.length){
    for(let i=0;i<t.devices.length;i++){
      const device=t.devices[i], num=i+1, itemId=oid+'-'+num;
      const name=device.device?device.device.name:'Item '+num;
      const services=device.repairProdItems?device.repairProdItems.map(s=>s.name.trim()).join(', '):'';
      const note=getDeviceNote(device,t);
      const pre=(device.PreConditions_images||[]).map(im=>im.medium||im.small);
      const evs=itemsMap[itemId]?itemsMap[itemId].events:[];
      const a=analyzeItem(evs);
      const workerList=Object.entries(a.byWorker).sort((x,y)=>y[1]-x[1]).map(([w,ms])=>`${esc(w)} (${fmtDur(ms)})`).join(', ');
      const statusBadge=a.working?`<span class="badge started">▶ ${esc(a.workingBy||'Working')}</span>`:(a.done?'<span class="badge stopped">Done</span>':'<span class="badge muted">Not started</span>');
      html+=`<div class="clickable" style="padding:12px 0;border-bottom:1px solid var(--border)" onclick="navigate('${h('item',itemId).replace(/'/g,"\\'")}')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>${esc(name)}</strong> <span style="color:var(--ink3);font-size:11px">${itemId}</span></div>
          <div style="display:flex;gap:8px;align-items:center"><span style="font-weight:700;color:var(--gold2)">${fmtDur(a.ms)}</span>${statusBadge}</div>
        </div>
        ${services?`<div style="font-size:11.5px;color:var(--gold2);margin-top:2px">${esc(services)}</div>`:''}
        ${note?`<div style="font-size:11.5px;color:var(--red);margin-top:2px">⚠️ ${esc(note)}</div>`:''}
        ${workerList?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">👷 ${workerList}</div>`:''}
        ${pre.length?`<div class="photo-grid" style="margin-top:8px;max-width:340px" onclick="event.stopPropagation()">${pre.map(u=>`<img src="${u}" onclick="lightbox('${jsstr(u)}')">`).join('')}</div>`:''}
      </div>`;
    }
  } else {
    items.forEach(([iid,it])=>{
      const a=analyzeItem(it.events);
      const statusBadge=a.working?`<span class="badge started">▶ ${esc(a.workingBy||'Working')}</span>`:(a.done?'<span class="badge stopped">Done</span>':'<span class="badge muted">—</span>');
      html+=`<div class="clickable" style="padding:12px 0;border-bottom:1px solid var(--border)" onclick="navigate('${h('item',iid).replace(/'/g,"\\'")}')">
        <div style="display:flex;justify-content:space-between"><strong>${it.desc&&it.desc!==iid?esc(it.desc):iid}</strong><span style="font-weight:700;color:var(--gold2)">${fmtDur(a.ms)}</span></div>
        <div style="font-size:11px;color:var(--ink3)">${iid} ${statusBadge}</div>
      </div>`;
    });
  }
  html+='</div>';
  el.innerHTML=html;
}

// ========================================================================
async function renderItemDetailPage(itemId){
  const el=document.getElementById('content');
  const oid=orderIdOf(itemId);
  const evts=scans.filter(s=>s.item_id===itemId).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const name=(evts[0]&&evts[0].item_desc&&evts[0].item_desc!==itemId)?evts[0].item_desc:'';

  let totalMs=0, openEvt=null;
  evts.forEach(e=>{ if((e.status||'').includes('Started'))openEvt=e; else if((e.status||'').includes('Stopped')&&openEvt){ totalMs+=new Date(e.created_at)-new Date(openEvt.created_at); openEvt=null; } });

  const subParts=[];
  if(name) subParts.push(itemId);
  if(evts[0]&&evts[0].customer&&evts[0].customer!=='undefined') subParts.push(esc(evts[0].customer));
  let html=`<div class="page-head"><div><div class="page-title">${esc(name||itemId)}</div>${subParts.length?`<div class="page-sub">${subParts.join(' · ')}</div>`:''}</div>
    <button class="btn btn-ghost btn-sm" onclick="navigate('${h('order',oid).replace(/'/g,"\\'")}')">📋 View full order (${esc(oid)})</button></div>`;

  html+=`<div class="card" style="text-align:center">
    <div class="card-label" style="margin-bottom:4px">Total Time Worked</div>
    <div style="font-family:'Outfit',sans-serif;font-size:34px;font-weight:700">${fmtDur(totalMs)}</div>
  </div>`;

  html+=itemPipeCardHtml(itemId);

  // Rework banner — this item went back to a stage it already passed
  const reworksHere=computeReworkForItem(evts);
  if(reworksHere.length){
    html+=`<div class="card" style="border-color:var(--orange);background:var(--orange-soft)">
      <div class="card-label" style="color:var(--orange)">↩️ Sent Back a Step</div>
      ${reworksHere.map(r=>`<div style="font-size:13px;padding:3px 0">Went back to <strong>${esc(r.role)}</strong> (round ${r.round}) — ${esc(r.worker)} · ${fmtDateFull(r.at)}</div>`).join('')}
    </div>`;
  }
  const reworkKeys=new Set(reworksHere.map(r=>r.at+'::'+(r.role||'—')));
  html+='<div id="item-svc-checklist"></div>';

  html+='<div class="card"><div class="card-label">Timeline <span style="font-weight:600;text-transform:none;color:var(--ink3)">— admins can edit or delete entries</span></div>';
  html+=evts.map((e,i)=>{
    const started=(e.status||'').includes('Started');
    // Flag a scan that repeats the previous one for the same worker+role (likely a double-scan)
    const prev=evts[i-1];
    const dupe=prev && ((prev.status||'').includes('Started')===started) && prev.worker===e.worker && (prev.role||'')===(e.role||'');
    return `<div class="timeline-row"${dupe?' style="background:var(--orange-soft)"':''}>
      <div class="tl-dot" style="background:${started?'var(--green)':'var(--orange)'}"></div>
      <div style="flex:1"><div style="font-weight:700">${started?'▶ Started':'■ Stopped'} · ${esc(e.role||'—')}${reworkKeys.has(e.created_at+'::'+(e.role||'—'))?' <span style="color:var(--orange);font-weight:700;font-size:11px">↩️ back to this step</span>':''}${dupe?' <span style="color:var(--orange);font-weight:600;font-size:11px">⚠️ duplicate scan — consider deleting</span>':''}</div>
      <div style="font-size:12px;color:var(--ink3)">${esc(e.worker)} · ${fmtDateFull(e.created_at)}</div></div>
      <div class="tl-actions">
        <button onclick="editScanEntry(${e.id||'null'},()=>renderItemDetailPage('${jsstr(itemId)}'))" title="Edit time">✏️</button>
        <button onclick="deleteScanEntry(${e.id||'null'},()=>renderItemDetailPage('${jsstr(itemId)}'))" title="Delete">🗑️</button>
      </div>
    </div>`;
  }).join('')||'<div class="empty">No scans yet</div>';
  html+='</div>';

  html+='<div id="item-notes-photos"><div class="empty">Loading notes & photos…</div></div>';
  el.innerHTML=html;

  // Async: repair note (from RepairDesk), worker notes, photos
  // Async: service checklist (assigned services vs actual scans)
  try{
    const base=(itemId.match(/^(T-\d+-\d+)/i)||[])[1]||itemId;
    const asg=await sb('item_services?item_id=eq.'+encodeURIComponent(base)+'&select=*');
    const svcs=(asg&&asg[0]&&asg[0].services)||[];
    const chk=document.getElementById('item-svc-checklist');
    if(chk&&svcs.length){
      const rows=svcs.map(svc=>{
        const mine=evts.filter(e=>(e.role||'')===svc);
        const hasStop=mine.some(e=>(e.status||'').includes('Stopped'));
        const lastIsStart=mine.length&&(mine[mine.length-1].status||'').includes('Started');
        const state=lastIsStart?'progress':(hasStop?'done':'pending');
        const icon=state==='done'?'✓':(state==='progress'?'▶':'○');
        const color=state==='done'?'var(--green)':(state==='progress'?'var(--gold)':'var(--ink3)');
        const lab=state==='done'?'Done':(state==='progress'?'In progress':'Not yet');
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="font-weight:600">${esc(svc)}</span>
          <span style="color:${color};font-weight:700;font-size:12.5px">${icon} ${lab}</span>
        </div>`;
      }).join('');
      chk.innerHTML=`<div class="card"><div class="card-label">Service Checklist</div>${rows}</div>`;
    }
  }catch(e){}

  // Each section loads independently and SAYS what happened. Previously all of this
  // was swallowed by catch(e){} so a failed RepairDesk proxy silently showed nothing.
  const box=document.getElementById('item-notes-photos');
  if(box) box.innerHTML='<div class="card"><div class="empty">Loading item details…</div></div>';

  let ticketBlock='', ticketErr='';
  try{
    const tid=await resolveTicketId(oid);
    const num=parseInt(itemId.split('-')[2])||1;
    if(!tid) throw new Error(oid+' was not found in RepairDesk (searched all tickets). It may have been deleted, or the order number changed.');
    const d=await fetchViaProxy(`${RD_BASE}/tickets/${tid}?api_key=${RD_KEY}`);
    const dev=d&&d.data&&d.data.devices?d.data.devices[num-1]:null;
    if(!dev) throw new Error('item '+num+' not found on ticket '+tid);

    const services=dev.repairProdItems?dev.repairProdItems.map(s=>String(s.name||'').trim()).filter(Boolean):[];
    const note=getDeviceNote(dev,d.data);
    const pre=(dev.PreConditions_images||[]).map(im=>im.medium||im.small);
    const due=dev.due_on?new Date(dev.due_on*1000):null;
    const cust=d.data.summary&&d.data.summary.customer?d.data.summary.customer:{};
    window._itemPreImgs=pre;

    ticketBlock+=`<div class="card"><div class="card-label">From RepairDesk</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
        <div><div style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em">Services ordered</div>
          <div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:5px">${
            services.length?services.map(s=>`<span style="background:var(--accent-soft);color:var(--gold2);font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:20px">${esc(s)}</span>`).join(''):'<span style="color:var(--ink3);font-size:13px">none listed</span>'}</div></div>
        ${dev.status&&dev.status.name?`<div><div style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em">RepairDesk status</div><div style="font-size:14px;font-weight:600;margin-top:5px">${esc(dev.status.name)}</div></div>`:''}
        ${due?`<div><div style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em">Due</div><div style="font-size:14px;font-weight:600;margin-top:5px">${due.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div></div>`:''}
        ${cust.mobile?`<div><div style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em">Customer</div><div style="font-size:13.5px;font-weight:600;margin-top:5px">${esc(cust.fullName||'')}</div><div style="font-size:12px;color:var(--ink3)">${esc(cust.mobile)}</div>${cust.address1?`<div style="font-size:11.5px;color:var(--ink3)">${esc(cust.address1)}${cust.city?', '+esc(cust.city):''}</div>`:''}</div>`:''}
      </div>`;
    if(note){
      let noteEs=''; try{ noteEs=await translateCached(note); }catch(_){}
      ticketBlock+=`<div class="note-box" style="margin-top:14px"><div class="nb-label">⚠️ Repair Note</div><div class="nb-en">${esc(note)}</div>${noteEs?`<div class="nb-es">🇪🇸 ${esc(noteEs)}</div>`:''}</div>`;
    }
    ticketBlock+='</div>';
  }catch(err){
    ticketErr=(err&&err.message)||String(err);
  }

  let notesHtml='', notesErr='';
  try{
    const nr=await sb('item_notes?item_id=eq.'+encodeURIComponent(itemId)+'&select=*&order=created_at.desc');
    if(Array.isArray(nr)&&nr.length){
      notesHtml=`<div class="card"><div class="card-label">Worker Notes (${nr.length})</div>`+
        nr.map(n=>`<div style="background:var(--surface2);border-radius:8px;padding:10px;margin-bottom:6px">
          <div style="font-size:13.5px">${esc(n.note)}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:3px">${esc(n.worker)}${n.role?' · '+esc(n.role):''} · ${fmtDateFull(n.created_at)}</div></div>`).join('')+'</div>';
    }
  }catch(err){ notesErr=(err&&err.message)||String(err); }

  let photosHtml='', photosErr='';
  try{
    const ir=await sb('item_images?item_id=eq.'+encodeURIComponent(itemId)+'&select=*&order=created_at.desc');
    const ours=(Array.isArray(ir)?ir:[]);
    const pre=window._itemPreImgs||[];
    if(ours.length||pre.length){
      photosHtml='<div class="card">';
      if(ours.length){
        photosHtml+=`<div class="card-label">Our Photos (${ours.length})</div><div class="photo-grid">`+
          ours.map(i=>`<div><img src="${i.image_url}" onclick="lightbox('${jsstr(i.image_url)}')">
            <div style="font-size:10px;color:var(--ink3);margin-top:3px;text-align:center">${esc(i.role||'')}${i.worker?'<br>'+esc(i.worker):''}</div></div>`).join('')+'</div>';
      }
      if(pre.length){
        photosHtml+=`<div class="card-label" style="margin-top:14px">Intake Photos — RepairDesk (${pre.length})</div><div class="photo-grid">`+
          pre.map(u=>`<img src="${u}" onclick="lightbox('${jsstr(u)}')">`).join('')+'</div>';
      }
      photosHtml+='</div>';
    }
  }catch(err){ photosErr=(err&&err.message)||String(err); }

  const problems=[];
  if(ticketErr) problems.push('RepairDesk details (services, note, intake photos): '+ticketErr);
  if(notesErr) problems.push('Worker notes: '+notesErr);
  if(photosErr) problems.push('Photos: '+photosErr);
  const problemBlock = problems.length
    ? `<div class="card" style="border-color:var(--orange);background:var(--orange-soft)">
        <div style="font-size:12.5px;color:var(--ink2)"><strong>Some details couldn't load</strong><br>${problems.map(esc).join('<br>')}
        <br><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="renderItemDetailPage('${jsstr(itemId)}')">Try again</button></div></div>`
    : '';
  const nothing = !ticketBlock && !notesHtml && !photosHtml && !problems.length
    ? '<div class="card"><div class="empty">No notes or photos recorded for this piece yet</div></div>' : '';

  if(box) box.innerHTML = ticketBlock + notesHtml + photosHtml + problemBlock + nothing;
}
function lightbox(url){ window.open(url,'_blank'); }

function renderHistoryPage(){
  document.getElementById('content').innerHTML=`
    <div class="page-head">
      <div><div class="page-title">History</div><div class="page-sub">Every scan, newest first — admins can edit or delete entries</div></div>
      <div class="head-actions">
        <input class="search" id="history-search" placeholder="Search item, worker, customer..." oninput="renderHistoryTable()"><button class="btn btn-ghost btn-sm" title="Scan a label" onclick="openScanSearch()" style="flex-shrink:0">📷 Scan</button>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)">
          <input type="date" id="hist-from" onchange="renderHistoryTable()" style="padding:6px 8px;font-size:12px;width:auto">
          <span>→</span>
          <input type="date" id="hist-to" onchange="renderHistoryTable()" style="padding:6px 8px;font-size:12px;width:auto">
        </div>
        <button class="btn btn-ghost btn-sm" onclick="exportHistory()">⬇ Export CSV</button>
      </div>
    </div>
    <div class="card"><div style="overflow-x:auto">
      <table id="history-table"><thead><tr><th>Time</th><th>Item</th><th>Customer</th><th>Worker</th><th>Role</th><th>Action</th><th></th></tr></thead><tbody></tbody></table>
    </div></div>
  `;
  renderHistoryTable();
}
function renderHistoryTable(){
  if(!document.getElementById('history-table')) return;
  const q=(document.getElementById('history-search').value||'').toLowerCase();
  const fEl=document.getElementById('hist-from'), tEl=document.getElementById('hist-to');
  const from=fEl&&fEl.value?new Date(fEl.value+'T00:00:00'):null;
  const to=tEl&&tEl.value?new Date(tEl.value+'T23:59:59'):null;
  const rows=scans.filter(s=>{
    if(q&&!(s.item_id+s.worker+(s.customer||'')+(s.item_desc||'')).toLowerCase().includes(q)) return false;
    const d=new Date(s.created_at);
    if(from&&d<from) return false;
    if(to&&d>to) return false;
    return true;
  }).slice(0,800).map(s=>`
    <tr><td style="white-space:nowrap">${fmtDate(s.created_at)}</td>
    <td class="clickable" onclick="navigate('${h('item',s.item_id).replace(/'/g,"\\'")}')"><strong>${s.item_desc&&s.item_desc!==s.item_id?esc(s.item_desc):''}</strong>${s.item_desc&&s.item_desc!==s.item_id?'<br>':''}<span style="color:var(--ink3);font-size:11px">${esc(s.item_id)}</span></td>
    <td>${esc(s.customer||'—')}</td><td>${esc(s.worker)}</td><td>${esc(s.role||'—')}</td>
    <td>${(s.status||'').includes('Started')?'<span class="badge started">▶ Start</span>':'<span class="badge stopped">■ Stop</span>'}</td>

function empInRange(dateStr){
  const d=new Date(dateStr);
  if(empRange==='custom'){ if(empFrom&&d<empFrom)return false; if(empTo&&d>empTo)return false; return true; }
  if(empRange==='all') return true;
  const now=new Date();
  if(empRange==='today') return d.toDateString()===now.toDateString();
  if(empRange==='week'){ const wk=new Date(now); wk.setDate(now.getDate()-7); return d>=wk; }
  if(empRange==='month'){ const mo=new Date(now); mo.setMonth(now.getMonth()-1); return d>=mo; }
  return true;
}
function empSetRange(r){
  empRange=r; empFrom=null; empTo=null;
  document.getElementById('emp-from').value=''; document.getElementById('emp-to').value='';
  document.querySelectorAll('#emp-range-seg button').forEach(b=>b.classList.toggle('on', b.dataset.r===r));
  renderEmployeeReportBody(window._empName);
}
function empCustomRange(){
  const f=document.getElementById('emp-from').value, t=document.getElementById('emp-to').value;
  empFrom=f?new Date(f+'T00:00:00'):null; empTo=t?new Date(t+'T23:59:59'):null;
  if(empFrom||empTo){ empRange='custom'; document.querySelectorAll('#emp-range-seg button').forEach(b=>b.classList.remove('on')); }
  renderEmployeeReportBody(window._empName);
}
function renderWorkerDetailPage(name){
  window._empName=name; empRange='today'; empFrom=null; empTo=null;
  document.getElementById('content').innerHTML=`

          <button class="on" data-r="today" onclick="empSetRange('today')">Today</button>
          <button data-r="week" onclick="empSetRange('week')">Week</button>
          <button data-r="month" onclick="empSetRange('month')">Month</button>
          <button data-r="all" onclick="empSetRange('all')">All</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)">
          <input type="date" id="emp-from" onchange="empCustomRange()" style="padding:6px 8px;font-size:12px;width:auto">
          <span>→</span>
          <input type="date" id="emp-to" onchange="empCustomRange()" style="padding:6px 8px;font-size:12px;width:auto">

        <input class="search" id="emp-search" placeholder="Search ticket, item..." oninput="renderEmployeeReportBody(window._empName)">
        <button class="btn btn-ghost btn-sm" onclick="exportEmployeeReport()">⬇ Export CSV</button>
      </div>
    </div>
    <div id="emp-content"></div>
  `;
  renderEmployeeReportBody(name);
}
function renderEmployeeReportBody(name){
  if(!name) return;
  const q=(document.getElementById('emp-search')?.value||'').toLowerCase().trim();
  const res=pairSessions(empInRange);
  let mine=res.sessions.filter(s=>s.worker===name);
  const openNow=res.open.filter(o=>o.worker===name);
  const totalMs=mine.reduce((a,s)=>a+s.ms,0);
  const items=new Set(mine.map(s=>s.item_id));
  const byOrder={};
  mine.forEach(s=>{ const oid=orderIdOf(s.item_id); if(!byOrder[oid])byOrder[oid]={ms:0,sessions:[],items:new Set()}; byOrder[oid].ms+=s.ms; byOrder[oid].sessions.push(s); byOrder[oid].items.add(s.item_id); });
  const byRole={}; mine.forEach(s=>{ const r=s.role||'—'; byRole[r]=(byRole[r]||0)+s.ms; });
  const byDay={}; mine.forEach(s=>{ const d=new Date(s.end).toLocaleDateString(); byDay[d]=(byDay[d]||0)+s.ms; });
  let orderList=Object.entries(byOrder).sort((a,b)=>b[1].ms-a[1].ms);
  if(q) orderList=orderList.filter(([oid,o])=>oid.toLowerCase().includes(q)||o.sessions.some(s=>(s.item_desc||'').toLowerCase().includes(q)||s.item_id.toLowerCase().includes(q)));

  let html=`<div class="stat-grid">
    <div class="card" style="text-align:center;margin:0"><div class="card-label">Total Time</div><div class="stat-num" style="font-size:28px">${fmtDur(totalMs)}</div></div>
    <div class="card" style="text-align:center;margin:0"><div class="card-label">Items</div><div class="stat-num" style="font-size:28px">${items.size}</div></div>
    <div class="card" style="text-align:center;margin:0"><div class="card-label">Sessions</div><div class="stat-num" style="font-size:28px">${mine.length}</div></div>
    <div class="card" style="text-align:center;margin:0"><div class="card-label">Orders</div><div class="stat-num" style="font-size:28px">${Object.keys(byOrder).length}</div></div>
  </div>`;

  if(openNow.length){
    html+='<div class="card" style="background:var(--green-soft);border-color:var(--green)"><div class="card-label" style="color:var(--green)">▶ Working Right Now</div>'+
      openNow.map(o=>`<div class="clickable" style="padding:8px 0" onclick="navigate('${h('item',o.item_id).replace(/'/g,"\\'")}')"><strong>${o.item_desc&&o.item_desc!==o.item_id?esc(o.item_desc):esc(o.item_id)}</strong> <span style="color:var(--ink3);font-size:11px">${esc(o.item_id)}</span> · ${esc(o.role||'—')} · since ${fmtDateFull(o.created_at)}</div>`).join('')+'</div>';
  }

  html+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">';
  html+='<div class="card" style="flex:1;min-width:240px;margin:0"><div class="card-label">Time by Role</div>'+
    (Object.entries(byRole).sort((a,b)=>b[1]-a[1]).map(([r,ms])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(r)}</span><strong>${fmtDur(ms)}</strong></div>`).join('')||'<div class="empty">None</div>')+'</div>';
  html+='<div class="card" style="flex:1;min-width:240px;margin:0"><div class="card-label">Time by Day</div>'+
    (Object.entries(byDay).sort((a,b)=>new Date(b[0])-new Date(a[0])).map(([d,ms])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(d)}</span><strong>${fmtDur(ms)}</strong></div>`).join('')||'<div class="empty">None</div>')+'</div>';
  html+='</div>';

  // Pieces first — the ticket number is secondary, the object is what matters
  const byPiece={};
  orderList.forEach(([oid,o])=>o.sessions.forEach(s=>{
    const k=s.item_id;
    const p=byPiece[k]=byPiece[k]||{itemId:s.item_id, desc:s.item_desc, oid, roles:{}, ms:0, last:s.end, runaway:false};
    p.ms+=s.ms; p.roles[s.role||'—']=(p.roles[s.role||'—']||0)+s.ms;
    if(s.runaway) p.runaway=true;
    if(new Date(s.end)>new Date(p.last)) p.last=s.end;
  }));
  const pieces=Object.values(byPiece).sort((a,b)=>new Date(b.last)-new Date(a.last));

  html+='<div class="card"><div class="card-label">Pieces Worked On <span style="font-weight:600;text-transform:none;color:var(--ink3)">— '+pieces.length+' piece'+(pieces.length!==1?'s':'')+'</span></div>';
  html+=pieces.length?pieces.map(p=>{
    const stages=Object.entries(p.roles).sort((a,b)=>b[1]-a[1]).map(([r,ms])=>esc(r)+' '+fmtDur(ms)).join(' · ');
    const name=p.desc&&p.desc!==p.itemId?esc(p.desc):esc(p.itemId);
    return `<div class="clickable" style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)"
      onclick="navigate('${h('item',p.itemId).replace(/'/g,"\\'")}')">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:15px">${name}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:2px">${stages}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px">${esc(p.itemId)} · ${fmtDate(p.last)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:800;color:${p.runaway?'var(--red)':'var(--gold2)'};font-family:'Outfit',sans-serif;font-size:16px">${fmtDur(p.ms)}${p.runaway?' ⚠️':''}</div>
        <button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="event.stopPropagation();navigate('${h('order',p.oid).replace(/'/g,"\\'")}')">${esc(p.oid)} →</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty">No work in this range</div>';
  html+='</div>';
  document.getElementById('emp-content').innerHTML=html;
}
function exportEmployeeReport(){
  const name=window._empName;
  const res=pairSessions(empInRange);
  const mine=res.sessions.filter(s=>s.worker===name).sort((a,b)=>new Date(b.end)-new Date(a.end));
  let csv='Order,Item,Item ID,Role,Start,End,Minutes,Flag\n';
  mine.forEach(s=>{ csv+=`"${orderIdOf(s.item_id)}","${(s.item_desc||'').replace(/"/g,'""')}","${s.item_id}","${s.role||''}","${fmtDateFull(s.start)}","${fmtDateFull(s.end)}",${Math.round(s.ms/60000)},"${s.runaway?'left running':''}"\n`; });
  downloadCsv(csv,name+'-report.csv');
}

      <div class="page-sub" style="margin-bottom:14px">Set your Dymo label dimensions in millimeters</div>
      <div class="row" style="margin-bottom:14px">
        <div class="field"><label>Width (mm)</label><input id="ls-width" type="number"></div>
        <div class="field"><label>Height (mm)</label><input id="ls-height" type="number"></div>
        <button class="btn btn-sm" onclick="saveLabelSize()">Save</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="setLabelPreset(102,59)">102 × 59</button>
        <button class="btn btn-ghost btn-sm" onclick="setLabelPreset(89,36)">89 × 36</button>
        <button class="btn btn-ghost btn-sm" onclick="setLabelPreset(57,32)">57 × 32</button>
        <button class="btn btn-ghost btn-sm" onclick="setLabelPreset(54,25)">54 × 25</button>
      </div>
    </div>
  `;
  document.getElementById('ls-width').value=labelSize.width;
  document.getElementById('ls-height').value=labelSize.height;
  renderPipeStagesList();
}
function renderPipeStagesList(){
  const el=document.getElementById('pipe-stages-list'); if(!el) return;
  el.innerHTML=WORK_STAGES.map((s,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11px;color:var(--ink3);width:18px">${i+1}.</span>
      <span style="font-weight:600;flex:1">${esc(s)}</span>
      <button class="btn btn-ghost btn-sm" ${i===0?'disabled style="opacity:.3"':''} onclick="stageMove(${i},-1)">↑</button>
      <button class="btn btn-ghost btn-sm" ${i===WORK_STAGES.length-1?'disabled style="opacity:.3"':''} onclick="stageMove(${i},1)">↓</button>
      <button class="btn btn-danger btn-sm" onclick="stageRemove(${i})">✕</button>
    </div>`).join('');
}
async function stageAdd(){
  const inp=document.getElementById('new-stage-name');
  const name=(inp.value||'').trim();
  if(!name){ toast('Enter a stage name'); return; }
  if(WORK_STAGES.some(s=>s.toLowerCase()===name.toLowerCase())){ toast('"'+name+'" is already a stage'); return; }
  // New stages go before Final Inspection if present, else at the end
  const fi=WORK_STAGES.findIndex(s=>s.toLowerCase().includes('final'));
  if(fi>=0) WORK_STAGES.splice(fi,0,name); else WORK_STAGES.push(name);
  if(await savePipeStages()){ inp.value=''; renderPipeStagesList(); toast('✅ Added "'+name+'" — remember to give this role to the workers who do it'); }
}
async function stageMove(i,dir){
  const j=i+dir; if(j<0||j>=WORK_STAGES.length) return;
  [WORK_STAGES[i],WORK_STAGES[j]]=[WORK_STAGES[j],WORK_STAGES[i]];
  if(await savePipeStages()) renderPipeStagesList();
}
async function stageRemove(i){
  const name=WORK_STAGES[i];
  if(WORK_STAGES.length<=1){ toast('You need at least one stage'); return; }
  if(!confirm('Remove stage "'+name+'"?\n\nItems and history keep their data — this stage just disappears from the pipeline board.')) return;
  WORK_STAGES.splice(i,1);
  if(await savePipeStages()){ renderPipeStagesList(); toast('Removed "'+name+'"'); }
}
async function changeAdminPassword(){
  const cur=document.getElementById('cur-pass').value, nw=document.getElementById('new-pass').value, nw2=document.getElementById('new-pass2').value;
  const real=await fetchAdminPass();
  if(cur!==real){ toast('Current password incorrect'); return; }
  if(nw.length<6){ toast('New password must be at least 6 characters'); return; }
  if(nw!==nw2){ toast('New passwords do not match'); return; }
  const r=await sb('settings?key=eq.admin_password',{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({value:nw})});
  if(r.ok){ toast('✅ Password updated'); document.getElementById('cur-pass').value=''; document.getElementById('new-pass').value=''; document.getElementById('new-pass2').value=''; }
  else toast('Could not update password');
}
function saveLabelSize(){
  const w=parseFloat(document.getElementById('ls-width').value), hgt=parseFloat(document.getElementById('ls-height').value);
  if(!w||!hgt||w<10||hgt<10){ toast('Enter valid dimensions'); return; }
  labelSize={width:w,height:hgt}; localStorage.setItem('glint_label_size', JSON.stringify(labelSize));
  toast('✅ Label size saved: '+w+' × '+hgt+' mm');
}
function setLabelPreset(w,hgt){
  labelSize={width:w,height:hgt}; localStorage.setItem('glint_label_size', JSON.stringify(labelSize));
  document.getElementById('ls-width').value=w; document.getElementById('ls-height').value=hgt;
  toast('✅ Label size: '+w+' × '+hgt+' mm');
}

// ========================================================================
// PHOTOS MODAL (used from Print Labels page) — index registry avoids quote-escaping issues
// ========================================================================
window._photoRegistry=[];
function registerPhotoData(itemId,name,preImgs){
  window._photoRegistry.push({itemId,name,preImgs});
  return window._photoRegistry.length-1;
}
function openPhotosModalByIndex(idx){
  const d=window._photoRegistry[idx]; if(!d) return;
  openPhotosModal(d.itemId, d.name, d.preImgs);
}
async function openPhotosModal(itemId, name, preImgs){
  openModal(`<span class="modal-close" onclick="closeModal()">✕</span><h3 style="margin-bottom:14px">${esc(name)}</h3><div id="pm-content"><div class="empty">Loading…</div></div>`);
  const el=document.getElementById('pm-content');
  let html='';
  try{
    const imgs=await sb('item_images?item_id=eq.'+encodeURIComponent(itemId)+'&select=*&order=created_at.desc');
    if(imgs&&imgs.length) html+='<div class="card-label">Our Photos</div><div class="photo-grid" style="margin-bottom:14px">'+imgs.map(i=>`<img src="${i.image_url}" onclick="lightbox('${jsstr(i.image_url)}')">`).join('')+'</div>';
  }catch(e){}
  if(preImgs&&preImgs.length) html+='<div class="card-label">Intake Photos</div><div class="photo-grid">'+preImgs.map(u=>`<img src="${u}" onclick="lightbox('${jsstr(u)}')">`).join('')+'</div>';
  el.innerHTML=html||'<div class="empty">No photos for this item</div>';
}
</script>
