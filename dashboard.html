<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glint — Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --ink:#12141c; --ink2:#4b5165; --ink3:#8b90a3;
  --gold:#4f46e5; --gold2:#4338ca; --green:#059669; --orange:#d97706; --red:#dc2626;
  --border:#e5e7eb; --surface:#ffffff; --surface2:#f1f2f6;
  --accent-soft:#eef0ff; --green-soft:#ecfdf5; --orange-soft:#fffbeb; --red-soft:#fef2f2;
  --sidebar-bg:#14161f; --sidebar-text:#8f95ab; --sidebar-border:#24263a;
  --sidebar-w:222px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Outfit',sans-serif;margin:0}
a{color:inherit;text-decoration:none}
input,select,textarea,button{font-family:'Inter',sans-serif;font-size:14px}
input,select,textarea{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--ink);width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--accent-soft)}

/* ===== LOGIN ===== */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(circle at 20% 20%, #eef0ff 0%, transparent 45%),radial-gradient(circle at 80% 80%, #f1f2f6 0%, transparent 45%)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:44px 38px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px -12px rgba(18,20,28,.12)}
.wordmark{font-family:'Outfit',sans-serif;font-weight:800;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px}
.wordmark .mark{width:10px;height:10px;border-radius:3.5px;background:var(--gold);display:inline-block;flex-shrink:0}
.login-box .wordmark{font-size:26px;justify-content:center;width:100%}
.login-box .subtitle{font-size:11px;letter-spacing:.15em;color:var(--ink3);text-transform:uppercase;margin-top:4px;margin-bottom:26px}
.login-box input{margin-bottom:12px;text-align:center}
.login-box button{width:100%;background:var(--gold);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;letter-spacing:.02em;transition:background .15s}
.login-box button:hover{background:var(--gold2)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;z-index:50}
.sidebar-logo{padding:24px 22px 20px;border-bottom:1px solid var(--sidebar-border)}
.sidebar-logo .wordmark{font-size:21px;line-height:1;color:#fff}
.sidebar-logo .subtitle{font-size:10px;letter-spacing:.14em;color:var(--sidebar-text);text-transform:uppercase;margin-top:4px;margin-left:18px}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto}
.snav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--sidebar-text);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px;transition:all .12s}
.snav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.snav-link.active{background:var(--gold);color:#fff;font-weight:600}
.snav-icon{width:16px;text-align:center;opacity:.9;font-size:13px}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--sidebar-border)}
.sidebar-foot .clk{font-size:11px;color:var(--sidebar-text);font-variant-numeric:tabular-nums}
.sidebar-foot .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:dot-pulse 2.4s infinite}
@keyframes dot-pulse{
  0%{box-shadow:0 0 0 0 rgba(5,150,105,.4)}
  70%{box-shadow:0 0 0 6px rgba(5,150,105,0)}
  100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}
}
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}
  70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}
  100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}
}
.wcard.state-warn{border-color:var(--orange)}
.wcard.state-crit{border-color:var(--red);animation:pulse-ring 2.2s infinite}
.section-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 12px}
.section-label:first-child{margin-top:0}
.live-split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.feed-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.feed-row:last-child{border-bottom:none}
.feed-row:hover{background:var(--surface2)}
.feed-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-text{font-size:12.5px;line-height:1.4}
.feed-time{font-size:11px;color:var(--ink3);margin-top:1px}
.roster-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.roster-row:last-child{border-bottom:none}
.roster-name{font-weight:600}
.roster-roles{font-size:11px;color:var(--ink3);margin-top:1px}
@media (max-width:1000px){.live-split{grid-template-columns:1fr}}
.logout-btn{margin-top:10px;width:100%;background:none;border:1px solid var(--sidebar-border);border-radius:7px;padding:8px;font-size:11px;color:var(--sidebar-text);cursor:pointer;transition:all .12s}
.logout-btn:hover{border-color:var(--ink3);color:#fff}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.breadcrumb{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.breadcrumb a{color:var(--ink3)}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline}
.breadcrumb .cur{color:var(--ink);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:14px}
.bell-wrap{position:relative}
.bell-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;transition:border-color .12s}
.bell-btn:hover{border-color:var(--gold)}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bell-panel{display:none;position:absolute;top:46px;right:0;width:340px;max-height:440px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px -12px rgba(18,20,28,.18);z-index:60}
.bell-panel.show{display:block}
.bell-panel-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.bell-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.bell-item:hover{background:var(--surface2)}
.bell-item .bt{color:var(--ink3);font-size:11px;margin-top:2px}

.content{flex:1;padding:26px 28px 60px}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.01em}
.page-sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(18,20,28,.03)}
.card-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.empty{color:var(--ink3);font-style:italic;padding:14px 0;text-align:center}
.clickable{cursor:pointer}
.clickable:hover{background:var(--surface2)}

.btn{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap;transition:all .12s}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-gold:hover{background:var(--gold2);border-color:var(--gold2);color:#fff}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2);color:var(--ink);border-color:var(--border)}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-block{width:100%}

.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink3);transition:all .12s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(18,20,28,.1)}
.search{max-width:280px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px;border-bottom:1.5px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:13px}
tr.clickable:hover td{background:var(--surface2)}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge.started{background:var(--green-soft);color:var(--green)}
.badge.stopped{background:var(--orange-soft);color:var(--orange)}
.badge.part{background:var(--surface2);color:var(--ink3);margin-left:6px}
.badge.muted{background:var(--surface2);color:var(--ink3)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all .12s;box-shadow:0 1px 2px rgba(18,20,28,.03)}
.stat-tile:hover{border-color:var(--gold);box-shadow:0 4px 14px -4px rgba(79,70,229,.18)}
.stat-tile.alert{border-color:var(--red)}
.stat-tile.warn{border-color:var(--orange)}
.stat-tile.warn .stat-num{color:var(--orange)}
.stat-num{font-family:'Outfit',sans-serif;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat-tile.alert .stat-num{color:var(--red)}
.stat-label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}

.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(18,20,28,.03)}
.wcard.working{border-color:var(--green);background:var(--green-soft)}
.wcard .wname{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700}
.wcard .wrole{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.wcard .witem{font-size:13px;margin-top:9px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border)}
.wcard .wtimer{font-family:'Outfit',sans-serif;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:8px}
.wcard .widle{color:var(--ink3);font-style:italic;font-size:12.5px;margin-top:10px}

.timeline-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.timeline-row:last-child{border-bottom:none}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.tl-actions{display:flex;gap:6px;margin-left:auto}
.tl-actions button{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:12px;padding:2px 6px}
.tl-actions button:hover{color:var(--ink)}

.field label{display:block;font-size:11px;color:var(--ink3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:flex-end}
.row .field{flex:1}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(18,20,28,.55);backdrop-filter:blur(2px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:26px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 30px 70px -15px rgba(18,20,28,.3)}
.modal-close{position:absolute;top:14px;right:16px;cursor:pointer;font-size:20px;color:var(--ink3)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}

.note-box{background:var(--red-soft);border:1px solid #f3b8b8;border-radius:8px;padding:10px 12px}
.note-box .nb-label{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.note-box .nb-en{font-size:13.5px;margin-top:3px}
.note-box .nb-es{font-size:12.5px;font-style:italic;color:var(--ink2);margin-top:4px}

/* ===== PIPELINE BOARD ===== */
.pipe-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}
.pipe-col{min-width:212px;width:212px;flex-shrink:0;background:var(--surface2);border-radius:12px;padding:10px 9px}
.pipe-col-head{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding:0 4px}
.pipe-col-head .cnt{background:var(--surface);border-radius:12px;padding:1px 8px;font-size:10.5px;color:var(--ink3)}
.pipe-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(18,20,28,.04);transition:border-color .12s}
.pipe-card:hover{border-color:var(--gold)}
.pipe-card.warn{border-color:var(--orange)}
.pipe-card.crit{border-color:var(--red)}
.pipe-card .pc-name{font-weight:700;font-size:13px;line-height:1.25}
.pipe-card .pc-id{font-size:10px;color:var(--ink3);margin-top:1px}
.pipe-card .pc-cust{font-size:11px;color:var(--ink2);margin-top:2px}
.pipe-card .pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}
.pipe-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.pipe-badge.b-wait{background:var(--surface2);color:var(--ink3)}
.pipe-badge.b-work{background:var(--green-soft);color:var(--green)}
.pipe-badge.b-pause{background:var(--orange-soft);color:var(--orange)}
.pipe-badge.b-ready{background:var(--accent-soft);color:var(--gold2)}
.pipe-badge.b-pieces{background:var(--orange-soft);color:var(--orange)}
.pipe-badge.b-done{background:var(--green-soft);color:var(--green)}
.pipe-time{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pipe-time.warn{color:var(--orange);font-weight:700}
.pipe-time.crit{color:var(--red);font-weight:700}
.pipe-track{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:5px}
.pipe-track>div{height:100%;background:var(--gold)}
.pipe-track.full>div{background:var(--green)}
.mobile-topbar{display:none}
/* Dim + tap-to-close backdrop behind the slide-out menu */
.nav-scrim{display:none;position:fixed;inset:0;background:rgba(18,20,28,.5);z-index:45;backdrop-filter:blur(1px)}
.nav-scrim.show{display:block}

@media (max-width:880px){
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35);width:270px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-topbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:44}
  .snav-link{padding:13px 14px;font-size:15px}   /* bigger tap targets */

  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-tile{padding:14px}
  .stat-num{font-size:26px}
  .stat-label{font-size:10px}

  .content{padding:14px 12px 70px}
  .topbar{padding:12px 14px;position:static}
  .page-title{font-size:21px}
  .card{padding:14px;border-radius:12px}
  .page-head{gap:10px}
  .head-actions{width:100%}
  .head-actions .seg{flex:1}
  .head-actions .seg button{flex:1;padding:9px 6px}
  .search{max-width:100%}

  /* Wide tables scroll sideways instead of squashing */
  .card table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  th,td{padding:9px 8px;font-size:12.5px}

  .worker-grid{grid-template-columns:1fr}
  .live-split{grid-template-columns:1fr}
  .bell-panel{width:calc(100vw - 28px);right:-6px}
  .modal{padding:18px;border-radius:14px}
  input,select,textarea{font-size:16px}   /* stops iOS zooming on focus */
}
@media (max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .page-title{font-size:19px}
  .btn{padding:8px 12px;font-size:12.5px}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="wordmark"><span class="mark"></span>Glint</div>
    <div class="subtitle">Control Room</div>
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()">Enter</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark"><span class="mark"></span>Glint</div>
      <div class="subtitle">Control Room</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-foot">
      <div class="clk"><span class="live-dot"></span><span id="live-clock">--:--:--</span></div>
      <div style="font-size:9.5px;color:var(--sidebar-text);opacity:.7;margin-top:3px">build 2026-08-03-d</div>
      <button class="logout-btn" onclick="doLogout()">Log Out</button>
    </div>
  </div>

  <div class="nav-scrim" id="nav-scrim" onclick="closeNav()"></div>

  <div class="main">
    <div class="mobile-topbar">
      <button class="btn btn-ghost btn-sm" onclick="toggleNav()">☰</button>
      <div class="wordmark" style="font-size:18px"><span class="mark"></span>Glint</div>
    </div>
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="topbar-actions">
        <div class="bell-wrap">
          <button class="bell-btn" onclick="toggleBell()">🔔<span class="bell-badge" id="bell-badge" style="display:none">0</span></button>
          <div class="bell-panel" id="bell-panel">
            <div class="bell-panel-head"><span>Notifications</span><span style="cursor:pointer;text-transform:none;font-weight:400" onclick="clearNotifications()">Clear</span></div>
            <div id="bell-list"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Generic modal for small forms (edit worker, etc.) -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-inner"></div>
</div>

<script>
// ========================================================================
// CONSTANTS
// ========================================================================
const SUPABASE_URL = 'https://pohjqjihxnikzpbqeevn.supabase.co';

// Part names become part of the barcode ID, so strip anything non-alphanumeric
function partSlug(p){
  // Barcode IDs must stay SHORT — long ones print bars too thin for a phone to read.
  const words=(p||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/)
    .filter(w=>w && !['AND','OR','THE','OF','WITH','A'].includes(w));
  if(!words.length) return '';
  if(words.length===1) return words[0].slice(0,5);
  return words.map(w=>w[0]).join('').slice(0,4);   // "Cups and Plates" -> "CP"
}
// Dense old barcodes get misread by phone cameras (CUPSANDPLATES -> CUPSANDPL$TE).
// A misread ID can't match the open session, so the scan would start a NEW timer
// instead of stopping the running one. Repair near-misses back to the real item.
function editDist(a,b){
  const m=a.length,n=b.length; if(Math.abs(m-n)>3) return 99;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
const LEGACY_PART_SLUGS={ CUPSANDPLATES:'CP', NONSILVERPIECES:'NSP' };
function normalizeItemId(id){
  const m=String(id||'').match(/^(T-\d+-\d+)-(.+)$/i);
  if(!m) return id;
  const suf=m[2].toUpperCase();
  if(LEGACY_PART_SLUGS[suf]) return m[1]+'-'+LEGACY_PART_SLUGS[suf];
  for(const long in LEGACY_PART_SLUGS){
    // Same opening letters + only a couple of wrong characters = a misread of this part,
    // not a different part. Guards against matching genuinely different names.
    const tol=long.length>=8?3:2;
    if(suf.slice(0,3)===long.slice(0,3) && editDist(suf,long)<=tol) return m[1]+'-'+LEGACY_PART_SLUGS[long];
  }
  return id;
}

async function sb(path, opts={}){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':opts.headers&&opts.headers['Prefer']?opts.headers['Prefer']:'return=representation',...(opts.headers||{})}});
  if(opts.method && opts.method!=='GET') return r;
  if(!r.ok) throw new Error('Supabase '+r.status+' on '+path.split('?')[0]);
  return r.json();
}
// Mobile connections drop the odd request. Retry a couple of times with a short
// backoff before giving up — most failures clear on the second try.
async function sbList(path, tries){
  let last;
  for(let i=0;i<(tries||3);i++){
    try{
      const r=await sb(path);
      if(Array.isArray(r)) return r;
      throw new Error('unexpected response');
    }catch(e){ last=e; await new Promise(res=>setTimeout(res, 400*(i+1))); }
  }
  throw last;
}

// Resilient multi-proxy fetch for RepairDesk API (browser CORS workaround)
const PROXIES = [
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u,
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)
];
async function fetchViaProxy(targetUrl){
  let lastErr=null;
  for(const make of PROXIES){
    try{
      const resp=await fetch(make(targetUrl));
      if(!resp.ok){ lastErr=new Error('HTTP '+resp.status); continue; }
      const txt=await resp.text();
      try{ return JSON.parse(txt); }catch(e){ lastErr=new Error('bad response'); continue; }
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('All proxies failed');
}

async function translateToSpanish(text){
  if(!text||!text.trim()) return '';
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q='+encodeURIComponent(text);
    const r=await fetch(url);
    const d=await r.json();
    if(Array.isArray(d)&&Array.isArray(d[0])) return d[0].map(seg=>seg[0]).join('');
  }catch(e){}
  return '';
}

function getOrderId(t){ return (t.summary&&t.summary.order_id)||''; }

// CRITICAL: RepairDesk's order_id (T-959) is NOT the internal ticket id (e.g. T-1095 => 1097).
// Guessing by stripping letters fetches a completely different ticket.
let oidMap = JSON.parse(localStorage.getItem('glint_oid_map')||'{}');
async function resolveTicketId(oid){
  if(oidMap[oid]) return oidMap[oid];
  if(allTickets.length){
    const hit=allTickets.find(x=>getOrderId(x)===oid);
    if(hit&&hit.summary&&hit.summary.id){ oidMap[oid]=hit.summary.id; localStorage.setItem('glint_oid_map',JSON.stringify(oidMap)); return oidMap[oid]; }
  }
  // Older tickets sit beyond the first pages. Keep paging until we find it or run out —
  // the map is cached, so this deep scan only happens once per unknown order.
  try{
    let pages=99;
    for(let page=1; page<=pages && page<=40; page++){
      const d=await fetchViaProxy(`${RD_BASE}/tickets?api_key=${RD_KEY}&per_page=250&page=${page}&default_order=1`);
      const batch=(d.data&&d.data.ticketData)||[];
      batch.forEach(t=>{ const o=t.summary&&t.summary.order_id; const id=t.summary&&t.summary.id; if(o&&id) oidMap[o]=id; });
      const pg=d.data&&d.data.pagination;
      if(pg&&pg.total_pages) pages=parseInt(pg.total_pages)||1;
      try{ localStorage.setItem('glint_oid_map',JSON.stringify(oidMap)); }catch(_){}
      if(oidMap[oid]) return oidMap[oid];
      if(!batch.length) break;
    }
  }catch(e){}
  return null; // never guess — wrong data is worse than no data
}

function pruneNotifications(){
  const cutoff=Date.now()-24*3600*1000;
  notifications=notifications.filter(n=>new Date(n.ts).getTime()>cutoff);
  localStorage.setItem('glint_notifications', JSON.stringify(notifications));
}
function checkForNewScans(){
  if(!scans.length) return;
  const sorted=[...scans].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const newest=sorted[sorted.length-1];
  if(!lastSeenTs){
    lastSeenTs=newest.created_at;
    localStorage.setItem('glint_last_seen_ts', lastSeenTs);
    renderBell(); return;
  }
  const newOnes=sorted.filter(s=>new Date(s.created_at)>new Date(lastSeenTs));
  if(newOnes.length){
    newOnes.forEach(s=>{
      const started=(s.status||'').includes('Started');
      let reworkNote=null;
      if(started){
        const itemEvts=scans.filter(x=>x.item_id===s.item_id);
        const rw=computeReworkForItem(itemEvts);
        const hit=rw.find(r=>r.at===s.created_at);
        if(hit) reworkNote=hit;
      }
      const label=s.item_desc&&s.item_desc!==s.item_id?s.item_desc:s.item_id;
      if(reworkNote){
        notifications.unshift({ itemId:s.item_id, text:`↩️ SENT BACK: ${label} went back to ${reworkNote.role} (round ${reworkNote.round}) — ${s.worker}`, ts:s.created_at });
      } else {
        notifications.unshift({ itemId:s.item_id, text:`${s.worker} ${started?'started':'stopped'} ${label}`, ts:s.created_at });
      }
    });
    lastSeenTs=newest.created_at;
    localStorage.setItem('glint_last_seen_ts', lastSeenTs);
    notifications=notifications.slice(0,150);
    localStorage.setItem('glint_notifications', JSON.stringify(notifications));
  }
  pruneNotifications();
  renderBell();
}

// Swipe from the left edge to open, swipe left on the menu to close
(function(){
  let x0=null, y0=null;
  document.addEventListener('touchstart', e=>{
    if(window.innerWidth>880) return;
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(x0===null || window.innerWidth>880) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dy)<50){
      const open=document.getElementById('sidebar').classList.contains('open');
      if(dx>0 && x0<32 && !open) openNav();
      else if(dx<0 && open) closeNav();
    }
    x0=null; y0=null;
  }, {passive:true});
})();

      showFatal(err&&err.message||err, route);
      document.getElementById('content').innerHTML='<div class="card"><div class="empty">This page could not load. Try another page from the menu.</div></div>';
    });
  }catch(err){
    showFatal(err&&err.message||err, route);
    document.getElementById('content').innerHTML='<div class="card"><div class="empty">This page could not load. Try another page from the menu.</div></div>';
  }
}

async function loadAllScans(){
  const r=await sbList('scans?select=*&order=created_at.desc&limit=5000');
  scans=(Array.isArray(r)?r:[]).map(s=>({...s, item_id:normalizeItemId(s.item_id)}));
  _unitsIdx=null;
}
async function loadWorkers(){ workers=await sbList('workers?select=*&order=name.asc'); }
async function loadRoles(){ roles=await sbList('roles?select=*&order=name.asc'); }
async function loadStageEvents(){ try{ const r=await sbList('stage_events?select=*&order=created_at.asc&limit=8000'); stageEvents=Array.isArray(r)?r:[]; }catch(e){ stageEvents=[]; } _unitsIdx=null; }
async function loadPipeLabels(){ try{ const r=await sbList('labels?select=item_id,item_name,customer,printed_at&order=printed_at.desc&limit=2000'); pipeLabels=(Array.isArray(r)?r:[]).map(l=>({...l, item_id:normalizeItemId(l.item_id)})); }catch(e){ pipeLabels=[]; } }

async function bootstrap(){
  startClock();
  if(!location.hash) location.hash='#/live';

  // THE WHITE-PAGE BUG: this used to be Promise.all, so ONE failed request (a flaky
  // moment on mobile data, Supabase blinking) rejected the whole thing, router() never
  // ran, and the page stayed blank. allSettled lets each load fail on its own and the
  // dashboard still draws with whatever arrived.
  const loaders=[
    ['scans', loadAllScans], ['workers', loadWorkers], ['roles', loadRoles],
    ['stage events', loadStageEvents], ['labels', loadPipeLabels], ['stages', loadPipeStages]
  ];
  const results=await Promise.allSettled(loaders.map(([,fn],i)=>
    new Promise(res=>setTimeout(res, i*120)).then(fn)));
  const failed=results.map((r,i)=>r.status==='rejected'
      ? loaders[i][0]+' ('+String((r.reason&&r.reason.message)||r.reason||'unknown').slice(0,70)+')'
      : null).filter(Boolean);

  // The workers table is only a convenience — every worker who has ever scanned is
  // already named in the scan history. If that request fails, rebuild from scans so
  // Live, Production and Timeline keep working normally.
  if(!Array.isArray(workers) || !workers.length){
    const names=[...new Set((scans||[]).map(s=>s.worker).filter(Boolean))].sort();
    if(names.length){
      workers=names.map(n=>({name:n, roles:[...new Set((scans||[]).filter(s=>s.worker===n).map(s=>s.role).filter(Boolean))]}));
      workersDerived=true;
    } else { workers=[]; }
  }

  try{ checkForNewScans(); }catch(e){}
  router();                                  // ALWAYS render, even on partial data

  if(failed.length){
    // One quiet retry — most of these are momentary
    setTimeout(async ()=>{
      const again=await Promise.allSettled(loaders.map(([,fn])=>fn()));
      const still=again.map((r,i)=>r.status==='rejected'
          ? loaders[i][0]+' ('+String((r.reason&&r.reason.message)||r.reason||'unknown').slice(0,70)+')'
          : null).filter(Boolean);
      if(still.length){
        showDataWarning(still);
      } else {
        const b=document.getElementById('data-warning'); if(b) b.remove();
        router();
      }
    }, 4000);
    showDataWarning(failed);
  }

  setInterval(async ()=>{
    await Promise.allSettled([loadAllScans(), loadStageEvents()]);
    try{ checkForNewScans(); }catch(e){}
    if(currentRoute()==='live') renderLivePage();
    if(currentRoute()==='pipeline') renderPipeBody();
  }, 15000);
  setInterval(()=>{ document.querySelectorAll('.live-timer[data-start]').forEach(updateOneTimer); }, 1000);
}

function updateOneTimer(el){
  const sec=Math.floor((Date.now()-new Date(el.dataset.start).getTime())/1000);
  const hh=Math.floor(sec/3600), mm=Math.floor((sec%3600)/60), ss=sec%60, pad=n=>String(n).padStart(2,'0');
  el.textContent = hh>0?`${hh}:${pad(mm)}:${pad(ss)}`:`${pad(mm)}:${pad(ss)}`;
}

// ========================================================================
// SESSIONS / TIME MATH
// ========================================================================
function pairSessions(filterFn){
  const chron=[...scans].reverse();
  const open={}; const sessions=[];
  chron.forEach(s=>{
    const key=s.item_id+'::'+(s.role||'')+'::'+s.worker;
    if((s.status||'').includes('Started')) open[key]=s;
    else if((s.status||'').includes('Stopped') && open[key]){
      const rawMs=Math.max(0,new Date(s.created_at)-new Date(open[key].created_at));
      const runaway=rawMs>MAX_SESSION_MS;
      sessions.push({ id:s.id, item_id:s.item_id, item_desc:s.item_desc, customer:s.customer, worker:s.worker, role:s.role, start:open[key].created_at, end:s.created_at, ms:runaway?MAX_SESSION_MS:rawMs, rawMs, runaway, startId:open[key].id, endId:s.id });
      delete open[key];
    }
  });
  return { sessions: filterFn?sessions.filter(x=>filterFn(x.end)):sessions, open:Object.values(open) };
}
function computeActive(){
  const chron=[...scans].reverse();
  const itemRoleState={};
  chron.forEach(s=>{
    const key=s.item_id+'::'+(s.role||'');
    if((s.status||'').includes('Started')) itemRoleState[key]={worker:s.worker,itemId:s.item_id,itemDesc:s.item_desc,role:s.role,startedAt:s.created_at};
    else delete itemRoleState[key];
  });
  const active={}; Object.values(itemRoleState).forEach(s=>active[s.worker]=s);
  const now=Date.now();
  const stale=Object.values(itemRoleState).filter(s=>(now-new Date(s.startedAt).getTime())>IDLE_ALERT_HOURS*3600*1000);
  return {active, all:Object.values(itemRoleState), stale};
}
function analyzeItem(events){
  const evts=[...events].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let ms=0, workingBy=null, hadRunaway=false; const byWorker={}; const openByKey={};
  evts.forEach(e=>{
    const key=(e.role||'')+'::'+e.worker;
    if((e.status||'').includes('Started')){ openByKey[key]=e; }
    else if((e.status||'').includes('Stopped')&&openByKey[key]){
      const raw=new Date(e.created_at)-new Date(openByKey[key].created_at);
      // Same cap as Reports: a session longer than this was left running, not worked
      const dur=raw>MAX_SESSION_MS?MAX_SESSION_MS:raw;
      if(raw>MAX_SESSION_MS) hadRunaway=true;
      ms+=dur; byWorker[e.worker]=(byWorker[e.worker]||0)+dur;
      delete openByKey[key];
    }
  });
  const stillOpen=Object.keys(openByKey).length>0;
  if(stillOpen) workingBy=Object.values(openByKey)[0].worker;
  const done=evts.length>0&&!stillOpen;
  return { ms, working:stillOpen, workingBy, done, byWorker, hadRunaway };
}

// ===== REWORK DETECTION =====
// An item "went back a step" when a role starts again AFTER a different role ran in between.
// (Cleaning -> Polish -> Cleaning again = rework. Cleaning stopped & resumed = NOT rework.)
function computeReworkForItem(events){
  const evts=[...events].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const seq=[];
  evts.forEach(e=>{
    if(!(e.status||'').includes('Started')) return;
    const r=e.role||'—';
    if(seq.length && seq[seq.length-1].role===r) return;
    seq.push({role:r, at:e.created_at, worker:e.worker});
  });
  const seen={}; const reworks=[];
  seq.forEach(v=>{
    seen[v.role]=(seen[v.role]||0)+1;
    if(seen[v.role]>1) reworks.push({role:v.role, at:v.at, round:seen[v.role], worker:v.worker});
  });
  return reworks;
}
function computeAllRework(){
  const byItem={};
  scans.forEach(s=>{ (byItem[s.item_id]=byItem[s.item_id]||{desc:s.item_desc, customer:s.customer, events:[]}).events.push(s); });
  const out=[];
  Object.entries(byItem).forEach(([id,d])=>{
    const rw=computeReworkForItem(d.events);
    if(rw.length) out.push({itemId:id, itemDesc:d.desc, customer:d.customer, reworks:rw, last:rw[rw.length-1].at});
  });
  return out.sort((a,b)=>new Date(b.last)-new Date(a.last));
}

// Abandoned timers never close on their own — a forgotten scan runs for days and
// wrecks that worker's numbers. This closes every one of them from the admin side,
// so it never depends on the worker's phone scanning correctly.
async function closeStaleSessions(hours){
  const cutoff = hours || IDLE_ALERT_HOURS;
  const {stale} = computeActive();
  const list = stale.filter(s => (Date.now()-new Date(s.startedAt).getTime()) > cutoff*3600*1000);
  if(!list.length){ toast('No timers older than '+cutoff+'h'); return; }
  if(!confirm('Close '+list.length+' timer'+(list.length!==1?'s':'')+' left running longer than '+cutoff+' hours?\n\n'+
     'Each is recorded as auto-stopped. Time already worked is kept; the runaway hours are not.')) return;
  let ok=0, failed=0;
  for(const s of list){
    try{
      const r=await fetch(SUPABASE_URL+'/rest/v1/scans',{method:'POST',
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({item_id:s.itemId, item_desc:s.itemDesc||'', status:(s.role||'')+' — Stopped (auto)', worker:s.worker, role:s.role||''})});
      r.ok?ok++:failed++;
    }catch(e){ failed++; }
  }
  toast('■ Closed '+ok+' timer'+(ok!==1?'s':'')+(failed?' · '+failed+' failed':''));
  await loadAllScans();
  renderLivePage();
}
async function liveForceStop(itemId, role, worker, desc){
  if(!confirm('Force stop '+worker+' on '+(desc||itemId)+'?')) return;
  const r=await fetch(SUPABASE_URL+'/rest/v1/scans',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({item_id:itemId,item_desc:desc,status:role+' — Stopped (admin)',worker:worker,role:role})});
  if(r.ok){ toast('■ Stopped '+worker); await loadAllScans(); renderLivePage(); }
  else toast('Could not stop');
}

      <div style="font-size:12px;color:var(--ink3)">${esc(s.worker)} · ${esc(s.role||'—')} · ${fmtDate(s.created_at)}</div></div>
      ${(s.status||'').includes('Started')?'<span class="badge started">▶ Start</span>':'<span class="badge stopped">■ Stop</span>'}
    </div>`).join(''):'<div class="empty">No scans today</div>';
  } else {
    const list=window._activeList||[];
    html+=list.length?list.map(s=>`<div class="timeline-row clickable" onclick="navigate('${h('item',s.itemId).replace(/'/g,"\\'")}')">

    </div>`).join(''):'<div class="empty">Nobody working right now</div>';
  }
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

// ========================================================================
// PIPELINE ENGINE — item stage tracking
// Stage position is COMPUTED from two sources:
//   1. scans (existing) — a "Started" scan under a role puts the item IN that stage
//      and automatically implies every earlier stage is finished
//   2. stage_events (new)  — explicit "finished" marks from workers + admin "override" moves
// "Waiting for X" is never stored — it's derived (previous stage finished, X not started).
// ========================================================================
// Work stages are CONFIGURABLE (Settings -> Pipeline Stages, stored in the settings table).
// Delivery stages are fixed — they're logistics, not services.
const DEFAULT_WORK_STAGES=['Cleaning','Antique','Polish','Inspection','Lacquer','Final Inspection'];
const DELIVERY_STAGES=['Packed','On Way','Delivered'];
let WORK_STAGES=[...DEFAULT_WORK_STAGES];
let STAGE_NAMES=[], PIPE_COLS=[], LASTW=5, DELIV0=6, DELIV_LAST=8, PIPE_MAXPOS=10;
function applyPipeStages(){
  STAGE_NAMES=[...WORK_STAGES, ...DELIVERY_STAGES];
  LASTW=WORK_STAGES.length-1;
  DELIV0=WORK_STAGES.length;
  DELIV_LAST=STAGE_NAMES.length-1;
  PIPE_MAXPOS=STAGE_NAMES.length+1;
  PIPE_COLS=[
    {k:'shop', l:'Waiting for Shop'},
    ...WORK_STAGES.map((s,i)=>({k:i, l:s})),
    {k:'ready', l:'Ready'},
    ...DELIVERY_STAGES.map((s,i)=>({k:DELIV0+i, l:s}))
  ];
}
applyPipeStages();
async function loadPipeStages(){
  try{
    const r=await sb("settings?key=eq.pipe_work_stages&select=value");
    if(r&&r[0]&&r[0].value){
      const arr=JSON.parse(r[0].value);
      if(Array.isArray(arr)&&arr.length&&arr.every(x=>typeof x==='string')){ WORK_STAGES=arr; applyPipeStages(); }
    }
  }catch(e){}
}
async function savePipeStages(){
  applyPipeStages();
  const r=await sb('settings?on_conflict=key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'pipe_work_stages', value:JSON.stringify(WORK_STAGES)})});
  if(!r.ok) toast('Could not save stage order');
  return r.ok;
}
const STUCK_WARN_DAYS=3, STUCK_CRIT_DAYS=7;
const PAUSE_DONE_HOURS=4; // a stop never resumed for this long means the step is done, not paused
// Map a worker role name to a pipeline stage index (loose matching so
// "Final Inspection", "final insp", etc. all land in the right place)
function stageForRole(role){
  const r=(role||'').toLowerCase().trim();
  if(!r) return null;
  if(!/unpack/.test(r) && /pack|deliver|driver|ship|on.?way|transit|route/.test(r)) return 'delivery';  // 'unpack' is intake, not delivery
  // 1. Exact match against the configured stage list
  for(let i=0;i<WORK_STAGES.length;i++){ if(r===WORK_STAGES[i].toLowerCase().trim()) return i; }
  // 2. Substring match either direction ("Gold Plating" role -> "Gold Plating" stage)
  for(let i=0;i<WORK_STAGES.length;i++){ const s=WORK_STAGES[i].toLowerCase().trim(); if(s&&(r.includes(s)||s.includes(r))) return i; }
  // 3. Legacy keyword fallback so old role names keep mapping
  const kw=[['final','Final Inspection'],['clean','Cleaning'],['antiq','Antique'],['polish','Polish'],['lacquer','Lacquer'],['laquer','Lacquer'],['lack','Lacquer'],['inspect','Inspection']];
  for(const [k,name] of kw){
    if(r.includes(k)){ const i=WORK_STAGES.findIndex(s=>s.toLowerCase().trim()===name.toLowerCase()); if(i>=0) return i; }
  }
  return null; // role has no pipeline stage — time is still tracked, pipeline unaffected
}
function stageIdxByName(n){ const x=(n||'').toLowerCase(); return STAGE_NAMES.findIndex(s=>s.toLowerCase()===x); }

// Walk an item's merged event history and figure out where it is right now.
// fin = index of the highest stage that is FINISHED (-1 = nothing finished yet)
function derivePipeState(events){
  let fin=-1, cur=null, since=null;
  events.forEach(e=>{
    since=e.t;
    if(e.kind==='override'){
      const st=(e.stage||'').toUpperCase();
      if(st==='RESET'){ fin=-1; cur=null; return; }
      if(st==='READY'){ fin=Math.max(fin,LASTW); cur=null; return; }
      const i=stageIdxByName(e.stage); if(i<0) return;
      fin = i>=DELIV0 ? i : i-1; // work stages: "move to waiting for X"; delivery stages: "item IS at X"
      cur=null;
    } else if(e.kind==='finish'){
      const i=stageIdxByName(e.stage); if(i<0) return;
      if(i>fin) fin=i;
      if(cur&&cur.idx<=fin) cur=null;
    } else if(e.kind==='start'){
      cur={idx:e.idx, st:'in_progress', worker:e.worker};
      if(e.idx-1>fin) fin=e.idx-1; // scanning a later stage auto-finishes everything before it
    } else if(e.kind==='stop'){
      if(cur&&cur.idx===e.idx) cur.st='paused';
    }
  });
  // Workers scan-stop when they FINISH a step — nobody presses a "finished" button.
  // So a stop that was never resumed within the grace period means the step is done:
  // show "waiting for the next step" instead of "paused" forever.
  if(cur && cur.st==='paused' && since && (Date.now()-new Date(since).getTime()) > PAUSE_DONE_HOURS*3600*1000){
    fin=Math.max(fin,cur.idx); cur=null;
  }
  let col, status, worker=null;
  if(cur&&cur.idx>fin){ col=cur.idx; status=cur.st; worker=cur.worker; }
  else if(fin<0){ col='shop'; status='waiting'; }
  else if(fin<LASTW){ col=fin+1; status='waiting'; }
  else if(fin===LASTW){ col='ready'; status='ready'; }
  else { col=fin; status='done'; }
  return {fin, col, status, worker, since};
}

// Numeric position along the whole pipeline (for progress bars): 0..PIPE_MAXPOS
function pipePos(it){
  if(it.col==='shop') return 0;
  if(it.col==='ready') return LASTW+2;
  if(typeof it.col==='number') return it.col<=LASTW ? it.col+1 : it.col+2;
  return 0;
}
function colLabel(col){ const c=PIPE_COLS.find(x=>x.k===col); return c?c.l:String(col); }
// Time chip: WORK time is the headline; idle/sitting time is labeled separately
function pipeTimeHtml(it, lvl){
  const cls=lvl===2?'crit':(lvl===1?'warn':'');
  const worked=`<span class="pipe-time">🕐 ${fmtDur(it.workedMs||0)} worked</span>`;
  const sit=it.since?Date.now()-new Date(it.since).getTime():0;
  const showIdle=(it.status==='waiting'||it.status==='paused'||it.status==='ready')&&sit>3600*1000;
  return worked + (showIdle?` <span class="pipe-time ${cls}">· idle ${fmtDur(sit)}</span>`:'');
}

function buildPipelineItems(){
  const items={};
  function ensure(id, desc, customer){
    id=(id||'').toUpperCase();
    if(!/^T-\d+-\d+/i.test(id)) return null; // only real Glint labels
    if(!items[id]) items[id]={id, desc:'', customer:'', events:[], workers:new Set()};
    if(desc&&desc!==id&&!items[id].desc) items[id].desc=desc;
    if(customer&&customer!=='undefined'&&!items[id].customer) items[id].customer=customer;
    return items[id];
  }
  (pipeLabels||[]).forEach(l=>ensure(l.item_id, l.item_name, l.customer)); // printed label = item exists, "Waiting for Shop"
  scans.forEach(s=>{
    const it=ensure(s.item_id, s.item_desc, s.customer); if(!it) return;
    if(s.worker) it.workers.add(s.worker);
    const idx=stageForRole(s.role);
    if(typeof idx!=='number') return;
    it.events.push({t:s.created_at, kind:(s.status||'').includes('Started')?'start':'stop', idx, worker:s.worker});
  });
  // RepairDesk is the authority on delivery. If a piece is marked Delivered / Picked up /
  // On way over there, reflect it here so the two systems agree without extra scanning.
  Object.entries(rdStatus||{}).forEach(([itemId,name])=>{
    const stage=rdStatusToStage(name);
    if(!stage) return;
    const it=items[itemId]; if(!it) return;
    it.events.push({t:new Date().toISOString(), kind:'override', stage, worker:'RepairDesk'});
    it.rdStatus=name;
  });

  (stageEvents||[]).forEach(e=>{
    // Bookkeeping events (attention dismissals, rework reasons, blocks) are not
    // pipeline movements — feeding them in would wrongly advance the item
    if(['attn-ack','rework-paid','rework-free','blocked-unbooked','override-unbooked'].includes(e.action)) return;
    const it=ensure(e.item_id, e.item_desc, ''); if(!it) return;
    if(e.worker) it.workers.add(e.worker);
    it.events.push({t:e.created_at, kind:e.action==='override'?'override':'finish', stage:e.stage, worker:e.worker});
  });
  Object.values(items).forEach(it=>{
    it.events.sort((a,b)=>new Date(a.t)-new Date(b.t));
    Object.assign(it, derivePipeState(it.events));
    // Actual WORK time: paired start->stop scans only. Sitting/paused time never counts.
    let worked=0; const openAt={};
    it.events.forEach(e=>{
      if(e.kind==='start') openAt[e.idx]=e.t;
      else if(e.kind==='stop' && openAt[e.idx]!==undefined){
        worked+=Math.min(new Date(e.t)-new Date(openAt[e.idx]), MAX_SESSION_MS);
        delete openAt[e.idx];
      }
    });
    // A session running right now counts up to the cap
    Object.values(openAt).forEach(t=>{ worked+=Math.min(Date.now()-new Date(t).getTime(), MAX_SESSION_MS); });
    it.workedMs=worked;
  });
  // "Waiting for other pieces": item is ready but its brothers in the same order aren't
  const byOrder={};
  Object.values(items).forEach(it=>{ const o=orderIdOf(it.id); (byOrder[o]=byOrder[o]||[]).push(it); });
  Object.values(byOrder).forEach(list=>{
    const allReady=list.every(x=>x.fin>=LASTW);
    list.forEach(x=>{ x.waitingPieces = (x.col==='ready') && !allReady && list.length>1; });
  });
  window._pipeItems=items;
  return {items, byOrder};
}
function pipeStuckLevel(it){
  if(it.col===DELIV_LAST||!it.since) return 0; // delivered items are never "stuck"
  const days=(Date.now()-new Date(it.since).getTime())/86400000;
  if(days>=STUCK_CRIT_DAYS) return 2;
  if(days>=STUCK_WARN_DAYS) return 1;
  return 0;
}
function pipeBadge(it){
  if(it.status==='in_progress') return `<span class="pipe-badge b-work">▶ ${esc(it.worker||'working')}</span>`;
  if(it.status==='paused') return `<span class="pipe-badge b-pause">⏸ paused</span>`;
  if(it.waitingPieces) return `<span class="pipe-badge b-pieces">⏳ waiting for pieces</span>`;
  if(it.status==='ready') return `<span class="pipe-badge b-ready">✓ ready</span>`;
  if(it.status==='done') return `<span class="pipe-badge b-done">✓ ${esc(colLabel(it.col))}</span>`;
  return `<span class="pipe-badge b-wait">waiting</span>`;
}

function renderPipelinePage(){
  document.getElementById('content').innerHTML=`
    <div class="page-head">
      <div><div class="page-title">Pipeline</div><div class="page-sub">Where every item is right now — scans move items forward automatically</div></div>
      <div class="head-actions">
        <div class="seg" id="pipe-view-seg">
          <button class="${pipeView==='board'?'on':''}" onclick="pipeSetView('board')">Board</button>
          <button class="${pipeView==='order'?'on':''}" onclick="pipeSetView('order')">By Order</button>
        </div>
        <input class="search" id="pipe-search" placeholder="Search order, customer, item, worker..." oninput="renderPipeBody()"><button class="btn btn-ghost btn-sm" title="Scan a label" onclick="openScanSearch()" style="flex-shrink:0">📷 Scan</button>
        <select id="pipe-stage" onchange="pipeStage=this.value;renderPipeBody()" style="width:auto;padding:8px 10px;font-size:12.5px">
          <option value="all">All steps</option>
          ${PIPE_COLS.map(c=>`<option value="${c.k}">${c.l}</option>`).join('')}
        </select>
        <select id="pipe-status" onchange="pipeStatus=this.value;renderPipeBody()" style="width:auto;padding:8px 10px;font-size:12.5px">
          <option value="all">All statuses</option>
          <option value="waiting">Waiting</option>
          <option value="in_progress">In progress</option>
          <option value="paused">Paused</option>
          <option value="stuck">Stuck ${STUCK_WARN_DAYS}+ days</option>
          <option value="pieces">Waiting for pieces</option>
        </select>
        <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);white-space:nowrap">
          <input type="checkbox" id="pipe-show-del" ${pipeShowDelivered?'checked':''} onchange="pipeShowDelivered=this.checked;renderPipeBody()" style="width:15px;height:15px"> Show delivered
        </label>
      </div>
    </div>
    <div id="pipe-body"></div>`;
  renderPipeBody();
}
function pipeSetView(v){
  pipeView=v;
  document.querySelectorAll('#pipe-view-seg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(v==='board')));
  renderPipeBody();
}
function pipeFilteredItems(){
  const q=(document.getElementById('pipe-search')?.value||'').toLowerCase().trim();
  const {items}=buildPipelineItems();
  return Object.values(items).filter(it=>{
    if(!pipeShowDelivered && it.col===DELIV_LAST) return false;
    if(pipeStage!=='all' && String(it.col)!==String(pipeStage)) return false;
    if(pipeStatus!=='all'){
      if(pipeStatus==='stuck'){ if(pipeStuckLevel(it)===0) return false; }
      else if(pipeStatus==='pieces'){ if(!it.waitingPieces) return false; }
      else if(it.status!==pipeStatus) return false;
    }
    if(q){
      const hay=(it.id+' '+(it.desc||'')+' '+(it.customer||'')+' '+orderIdOf(it.id)+' '+[...it.workers].join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderPipeBody(){
  const box=document.getElementById('pipe-body');
  if(!box) return;
  const list=pipeFilteredItems();
  if(!list.length){ box.innerHTML='<div class="card"><div class="empty">No items match — items appear here once a label is printed or the first scan happens</div></div>'; return; }
  if(pipeView==='board') box.innerHTML=renderPipeBoard(list);
  else box.innerHTML=renderPipeByOrder(list);
}
function renderPipeBoard(list){
  const cols=PIPE_COLS.filter(c=>pipeShowDelivered || c.k!==DELIV_LAST || list.some(it=>it.col===DELIV_LAST));
  return `<div class="pipe-board">`+cols.map(c=>{
    const its=list.filter(it=>it.col===c.k).sort((a,b)=>new Date(a.since||0)-new Date(b.since||0));
    return `<div class="pipe-col">
      <div class="pipe-col-head"><span>${c.l}</span><span class="cnt">${its.length}</span></div>
      ${its.map(it=>{
        const lvl=pipeStuckLevel(it);
        return `<div class="pipe-card ${lvl===2?'crit':(lvl===1?'warn':'')}" onclick="openPipeModal('${jsstr(it.id)}')">
          <div class="pc-name">${esc(it.desc||it.id)}</div>
          <div class="pc-id">${esc(it.id)} · ${esc(orderIdOf(it.id))}</div>
          ${it.customer?`<div class="pc-cust">${esc(it.customer)}</div>`:''}
          <div class="pc-foot">${pipeBadge(it)}${pipeTimeHtml(it,lvl)}</div>
        </div>`;
      }).join('')||'<div style="font-size:11px;color:var(--ink3);text-align:center;padding:10px 0">—</div>'}
    </div>`;
  }).join('')+`</div>`;
}
function renderPipeByOrder(list){
  const byOrder={};
  list.forEach(it=>{ const o=orderIdOf(it.id); (byOrder[o]=byOrder[o]||[]).push(it); });
  const orders=Object.entries(byOrder).sort((a,b)=>{
    const la=Math.max(...a[1].map(x=>new Date(x.since||0).getTime()));
    const lb=Math.max(...b[1].map(x=>new Date(x.since||0).getTime()));
    return lb-la;
  });
  return orders.map(([oid,its])=>{
    const delivered=its.filter(x=>x.col===DELIV_LAST).length;
    const ready=its.filter(x=>x.fin>=LASTW).length;
    const cust=its.find(x=>x.customer)?.customer||'';
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <div>
          <span style="font-size:11px;font-weight:700;color:var(--gold2);cursor:pointer" onclick="navigate('${h('order',oid).replace(/'/g,"\\'")}')">${esc(oid)} ›</span>
          <div style="font-family:'Outfit',sans-serif;font-size:19px;font-weight:700">${esc(cust||'Name not recorded')}</div>
        </div>
        <div style="font-size:12px;color:var(--ink3);text-align:right">${its.length} item${its.length!==1?'s':''} · ${ready} ready · ${delivered} delivered</div>
      </div>
      ${its.sort((a,b)=>pipePos(a)-pipePos(b)).map(it=>{
        const pos=pipePos(it), pct=Math.round(pos/PIPE_MAXPOS*100), lvl=pipeStuckLevel(it);

async function loadTickets(){
  const el=document.getElementById('tickets-list');
  if(!el) return;
  el.innerHTML='<div class="empty">Loading tickets…</div>';
  try{
    let fetched=[]; let page=1, totalPages=1;
    do{
      const data=await fetchViaProxy(`${RD_BASE}/tickets?api_key=${RD_KEY}&per_page=250&page=${page}&default_order=1`);
      const batch=(data.data&&data.data.ticketData)||[];
      fetched=fetched.concat(batch);
      const pg=data.data&&data.data.pagination; totalPages=pg?parseInt(pg.total_pages):1;
      page++;
    } while(page<=totalPages && page<=2);
    allTickets=fetched;
    // Warm the order_id -> internal ticket id map while we have the list
    fetched.forEach(t=>{ const o=t.summary&&t.summary.order_id; const id=t.summary&&t.summary.id; if(o&&id) oidMap[o]=id; });
    // RepairDesk's own per-item status — used to auto-close delivered pieces
    rdStatus={};
    fetched.forEach(t=>{
      const o=t.summary&&t.summary.order_id; if(!o) return;
      (t.devices||[]).forEach((d,i)=>{
        const nm=d.status&&d.status.name; if(nm) rdStatus[o+'-'+(i+1)]=nm;
      });
    });
    try{ localStorage.setItem('glint_rd_status', JSON.stringify(rdStatus)); }catch(e){}
    localStorage.setItem('glint_oid_map',JSON.stringify(oidMap));
    renderTickets(allTickets);
  }catch(err){
    el.innerHTML='<div class="empty">Could not load tickets — '+esc(err.message)+'. Tap Reload to try again.</div>';
  }
}
function filterTickets(){
  const q=(document.getElementById('tickets-search').value||'').toLowerCase();

  renderTickets(allTickets.filter(t=>getOrderId(t).toLowerCase().includes(q)||getCustomerName(t).toLowerCase().includes(q)));

        <div style="font-size:10.5px;color:var(--ink3)">${itemId}</div>

async function loadItemServicesForTicket(oid, count){

    const ids=[]; for(let i=1;i<=count;i++) ids.push('"'+oid+'-'+i+'"');
    const rows=await sb('item_services?item_id=in.('+encodeURIComponent(ids.join(','))+')&select=*');
    (Array.isArray(rows)?rows:[]).forEach(r=>{ window._itemSvc[r.item_id]=r.services||[]; });

function addCustomPart(itemId){

function weekStart(dateInput){
  const dt=new Date(dateInput);
  const day=dt.getDay(); // 0=Sun..6=Sat
  const diff=(day===0?-6:1-day); // Monday-based week start
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function renderWeeklyTrend(){
  const el=document.getElementById('weekly-trend');
  if(!el) return;
  const {sessions}=pairSessions(()=>true); // all-time, independent of the table date filter
  const weeks={}; // key: week-start ISO date -> ms
  sessions.forEach(s=>{
    const wk=weekStart(s.end).toISOString().slice(0,10);
    weeks[wk]=(weeks[wk]||0)+s.ms;
  });
  // Build last 10 week buckets (including zero weeks), ending with the current week
  const buckets=[];
  const curWk=weekStart(new Date());
  for(let i=9;i>=0;i--){
    const d=new Date(curWk); d.setDate(d.getDate()-7*i);
    const key=d.toISOString().slice(0,10);
    buckets.push({key, date:d, ms:weeks[key]||0});
  }
  const maxMs=Math.max(...buckets.map(b=>b.ms), 1);
  el.innerHTML=`<div style="display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0">
    ${buckets.map(b=>{
      const pct=Math.round((b.ms/maxMs)*100);
      const hrs=(b.ms/3600000).toFixed(1);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end">
        <div style="font-size:10px;color:var(--ink3);margin-bottom:3px">${b.ms>0?hrs+'h':''}</div>
        <div style="width:100%;max-width:34px;height:${Math.max(pct,2)}%;background:${b.ms>0?'var(--gold)':'var(--surface2)'};border-radius:4px 4px 0 0" title="${fmtDur(b.ms)}"></div>
        <div style="font-size:9.5px;color:var(--ink3);margin-top:6px;white-space:nowrap">${b.date.toLocaleDateString([], {month:'short',day:'numeric'})}</div>
      </div>`;
    }).join('')}
  </div>`;
}

let prodValueCache={}; // parent itemId -> value
let prodValueSrc={};   // parent itemId -> 'item' | 'split' | 'default'
// Prices come from RepairDesk only — nothing to configure here.
// What one piece of work at this stage is worth.
// A $400 item needing Polish + Lacquer books $200 when each stage completes,
// so the stages add up to the item's real price instead of counting it twice.
function pieceValue(role,itemId){

function prodRange(period, offset){
  const now=new Date(); let start, end;
  if(period==='day'){
    start=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset);
    end=new Date(start); end.setDate(end.getDate()+1);
  } else if(period==='month'){
    start=new Date(now.getFullYear(),now.getMonth()+offset,1);
    end=new Date(now.getFullYear(),now.getMonth()+offset+1,1);
  } else {
    const dow=(now.getDay()+6)%7; // Monday start
    start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+offset*7);
    end=new Date(start); end.setDate(end.getDate()+7);
  }

}

  if(period==='month') return start.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const e=new Date(end); e.setDate(e.getDate()-1);

// Item value: ticket price split across its items; falls back to the default you set
// Split parts (T-902-1-CP) belong to their parent item — value counts once per parent
function parentItemId(itemId){ const m=String(itemId||'').match(/^(T-\d+-\d+)/i); return m?m[1]:itemId; }
// CONFIRMED from live RepairDesk data:
//   summary.total   -> "$54.19"  (dollar sign breaks parseFloat — must be stripped)
//   devices[i].price-> "50.00"   (per-item charge, pre-tax — this is what we want)
//   devices[i].line_discount, .gst
//   repairProdItems -> {name, id} only, NO price field
function money(v){
  const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
// How many PAID work units an item is divided into.
//  - the services RepairDesk billed for
//  - PLUS any stage actually worked that wasn't on the ticket (e.g. Antique added later),
//    so adding work automatically gives everyone a smaller share
//  - PLUS one unit per rework the worker was NOT at fault for (redone through no
//    fault of theirs = paid again; their own poor job = not paid again)
let _unitsIdx=null;
function buildUnitsIndex(){
  const roles={}, paid={};
  (scans||[]).forEach(s=>{
    const b=parentItemId(s.item_id), r=(s.role||'').trim().toUpperCase();
    if(!r) return; (roles[b]=roles[b]||new Set()).add(r);
  });
  (stageEvents||[]).forEach(e=>{
    if(e.action!=='rework-paid') return;
    const b=parentItemId(e.item_id); paid[b]=(paid[b]||0)+1;
  });
  _unitsIdx={roles,paid};
}
function paidUnits(baseId, rdServiceNames){
  if(!_unitsIdx) buildUnitsIndex();
  const set=new Set((rdServiceNames||[]).map(n=>String(n||'').trim().toUpperCase()).filter(Boolean));
  const worked=_unitsIdx.roles[baseId];
  if(worked) worked.forEach(r=>set.add(r));
  return Math.max(set.size,1) + (_unitsIdx.paid[baseId]||0);
}

// The real charge for one item, plus how many paid units it covers
function itemPriceInfo(itemId){
  const base=parentItemId(itemId);
  if(prodValueCache[base]!==undefined) return prodValueCache[base];
  const oid=orderIdOf(base);
  const idx=parseInt((base.split('-')[2]||'1'),10)||1;
  let info={price:0, nSvc:1, src:'none'};
  const t=(allTickets||[]).find(x=>getOrderId(x)===oid);
  const dev=t&&t.devices&&t.devices[idx-1];
  if(dev){
    const net=money(dev.price)-money(dev.line_discount);
    const names=Array.isArray(dev.repairProdItems)?dev.repairProdItems.map(s=>s.name):[];
    info={price:Math.max(net,0), nSvc:paidUnits(base,names), src:'item'};
    if(info.price===0 && money(dev.total)>0){ info.price=money(dev.total); }
  }
  prodValueSrc[base]=info.src;
  prodValueCache[base]=info; return info;
}
function itemValue(itemId){ return itemPriceInfo(itemId).price; }

// What THIS piece is charged: its own service lines. Falls back to an even split of the
// ticket total, then to the default you set in Settings.
function itemValue(itemId){
  const base=parentItemId(itemId);
  if(prodValueCache[base]!==undefined) return prodValueCache[base];
  const oid=orderIdOf(base);
  const idx=parseInt((base.split('-')[2]||'1'),10)||1;
  const t=(allTickets||[]).find(x=>getOrderId(x)===oid);
  if(t){
    const dev=t.devices&&t.devices[idx-1];
    // 1. True per-piece: sum this item's own service prices
    if(dev&&Array.isArray(dev.repairProdItems)&&dev.repairProdItems.length){
      const sum=dev.repairProdItems.reduce((a,s)=>a+priceOf(s),0);
      if(sum>0){ v=sum; src='item'; }
    }
    // 2. Fallback: ticket total shared across items
    if(src!=='item'&&t.summary){
      const raw=priceOf(t.summary);
      const n=(t.devices&&t.devices.length)||1;
      if(raw>0){ v=raw/n; src='split'; }
    }
  }
  prodValueSrc[base]=src;
  prodValueCache[base]=v; return v;
}
// Core metric: pieces = distinct item×stage with a finished session in range
function prodMetrics(start,end){
  const {sessions:sess}=pairSessions(t=>{ const e=new Date(t); return e>=start && e<end; });
  const stagePieces={}, stageMs={}, workerPieces={}, workerMs={}, workerStages={};
  const seenStage={}, seenWorker={};
  let totalMs=0, value=0; const seenValue={};
  sess.forEach(s=>{
    const role=s.role||'—';
    totalMs+=s.ms;
    stageMs[role]=(stageMs[role]||0)+s.ms;
    workerMs[s.worker]=(workerMs[s.worker]||0)+s.ms;
    const kS=role+'::'+s.item_id;
    if(!seenStage[kS]){ seenStage[kS]=1; stagePieces[role]=(stagePieces[role]||0)+1; }
    const kW=s.worker+'::'+role+'::'+s.item_id;
    if(!seenWorker[kW]){
      seenWorker[kW]=1;
      workerPieces[s.worker]=(workerPieces[s.worker]||0)+1;
      (workerStages[s.worker]=workerStages[s.worker]||{})[role]=(workerStages[s.worker][role]||0)+1;
      const kV=role+'::'+parentItemId(s.item_id);
      if(!seenValue[kV]){ seenValue[kV]=1; value+=pieceValue(role,s.item_id); }
    }
  });
  const pieces=Object.values(stagePieces).reduce((a,b)=>a+b,0);
  return {sess,stagePieces,stageMs,workerPieces,workerMs,workerStages,pieces,totalMs,value};
}
// Best period ever, for "record" comparisons
function prodRecords(period){
  const buckets={};
  pairSessions().sessions.forEach(s=>{
    const d=new Date(s.end); let key;
    if(period==='day') key=d.toDateString();
    else if(period==='month') key=d.getFullYear()+'-'+d.getMonth();
    else { const t=new Date(d); t.setDate(t.getDate()-((t.getDay()+6)%7)); key=t.toDateString(); }
    const b=(buckets[key]=buckets[key]||{stage:{},worker:{},seenS:{},seenW:{},total:0});
    const role=s.role||'—';
    if(!b.seenS[role+'::'+s.item_id]){ b.seenS[role+'::'+s.item_id]=1; b.stage[role]=(b.stage[role]||0)+1; b.total++; }
    if(!b.seenW[s.worker+'::'+role+'::'+s.item_id]){ b.seenW[s.worker+'::'+role+'::'+s.item_id]=1; b.worker[s.worker]=(b.worker[s.worker]||0)+1; }
  });
  const recStage={}, recWorker={}; let recTotal=0;
  Object.values(buckets).forEach(b=>{
    recTotal=Math.max(recTotal,b.total);
    Object.entries(b.stage).forEach(([k,v])=>{ recStage[k]=Math.max(recStage[k]||0,v); });
    Object.entries(b.worker).forEach(([k,v])=>{ recWorker[k]=Math.max(recWorker[k]||0,v); });
  });
  return {recStage,recWorker,recTotal};
}
function prodDelta(cur,prev){
  if(!prev) return cur>0?'<span style="color:var(--green);font-size:11px;font-weight:700">new</span>':'';
  const pct=Math.round((cur-prev)/prev*100);
  const col=pct>=0?'var(--green)':'var(--red)';
  return `<span style="color:${col};font-size:11px;font-weight:700">${pct>=0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}
function fmtMoney(v){ return '$'+Math.round(v).toLocaleString(); }
// Workers are measured in points: $100 of finished work = 1 point
function toPoints(v){ return v/100; }
function fmtPts(v){ return (v>=100?Math.round(v):(Math.round(v*10)/10)).toLocaleString()+' pts'; }

let STUCK_HOURS=parseInt(localStorage.getItem('glint_stuck_hours')||'48',10);
function attnSetStuck(h){ STUCK_HOURS=h; localStorage.setItem('glint_stuck_hours',String(h)); renderAttentionPage(); }
let attnFilter='all';
let _attnCount=0;
let rdStatus=JSON.parse(localStorage.getItem('glint_rd_status')||'{}');   // itemId -> RepairDesk status
let workersDerived=false;   // true when the workers list came from scans, not the table
function attnAcks(){
  // Dismissals are stored as stage_events: action 'attn-ack', reason kept in `stage`
  const acks={};
  (stageEvents||[]).forEach(e=>{
    if(e.action!=='attn-ack') return;
    acks[e.item_id+'::'+(e.item_desc||'')]=true;   // item_desc carries the issue type
    acks['REASON::'+e.item_id+'::'+(e.item_desc||'')]=e.stage||'';
    acks['WHEN::'+e.item_id+'::'+(e.item_desc||'')]=e.created_at;
  });
  return acks;
}
function attnIsAcked(acks, itemId, type){ return !!acks[itemId+'::'+type]; }

function computeAttention(){
  const {items}=buildPipelineItems();
  const acks=attnAcks();
  const all=Object.values(items);
  const now=Date.now();
  const issues=[];

  // Group by order so we can see stragglers
  const byOrder={};
  all.forEach(it=>{ const o=orderIdOf(it.id); (byOrder[o]=byOrder[o]||[]).push(it); });

  all.forEach(it=>{
    if(it.col===DELIV_LAST) return;                       // delivered, nothing to chase
    const sinceMs = it.since ? now-new Date(it.since).getTime() : 0;
    const hours = sinceMs/3600000;

    // 1. Stuck at one step for over a day
    if(hours>=STUCK_HOURS && it.col!=='ready'){
      issues.push({type:'stuck', item:it, hours,
        title:'Sitting too long', detail:'No movement for '+Math.floor(hours/24)+'d '+Math.round(hours%24)+'h at '+colLabel(it.col),
        sev: hours>=72?2:1});
    }
  });

  // 2. Waiting for a set — the rest of the order is done, these are holding it up
  Object.entries(byOrder).forEach(([oid,list])=>{
    if(list.length<2) return;
    const done=list.filter(x=>x.fin>=LASTW || x.col==='ready' || (typeof x.col==='number'&&x.col>=DELIV0));
    const behind=list.filter(x=>!(x.fin>=LASTW || x.col==='ready' || (typeof x.col==='number'&&x.col>=DELIV0)));
    if(done.length && behind.length && done.length>=list.length-behind.length && behind.length<=Math.max(2,Math.floor(list.length/2))){
      behind.forEach(x=>{
        issues.push({type:'set', item:x, oid,
          title:'Holding up a set', detail:done.length+' of '+list.length+' pieces on '+oid+' are ready — this one is at '+colLabel(x.col),
          sev: done.length===list.length-1?2:1});
      });
    }
  });

  // 3. Left behind — the rest of the order moved past this piece
  Object.entries(byOrder).forEach(([oid,list])=>{
    if(list.length<2) return;
    const pos=list.map(x=>pipePos(x));
    const maxPos=Math.max(...pos);
    list.forEach((x,i)=>{
      const gap=maxPos-pos[i];
      const idleH = x.since ? (now-new Date(x.since).getTime())/3600000 : 0;
      if(gap>=3 && pipePos(x)<=LASTW && idleH>=12){
        issues.push({type:'behind', item:x, oid,
          title:'Left behind', detail:'The rest of '+oid+' has moved '+gap+' steps ahead — this is still at '+colLabel(x.col),
          sev:1});
      }
    });
  });

  // ONE row per item — the most important reason only. An item that's stuck AND
  // behind AND holding a set is a single problem to chase, not three.
  const PRIORITY={set:3, stuck:2, behind:1};
  const best={};
  issues.forEach(is=>{
    is.acked=attnIsAcked(acks,is.item.id,is.type);
    is.ackReason=acks['REASON::'+is.item.id+'::'+is.type]||'';
    const cur=best[is.item.id];
    const score=PRIORITY[is.type]*10+is.sev;
    if(!cur || score>cur._score){ is._score=score; best[is.item.id]=is; }
  });
  const out=Object.values(best);
  out.sort((a,b)=> (a.acked-b.acked) || (b._score-a._score) || (b.hours||0)-(a.hours||0));
  return out;
}
function attentionCount(){
  try{ return computeAttention().filter(i=>!i.acked).length; }catch(e){ return 0; }
}

async function attnAck(itemId, type, desc){

    body:JSON.stringify({item_id:itemId, item_desc:type, stage:reason||'no reason given', action:'attn-ack', worker:'Admin'})});

let workerHours={};
const TL_DEFAULT={start:'09:00', end:'17:00'};
let TL_TIPS=[];
const TL_HUES=['#4f46e5','#0ea5e9','#059669','#d97706','#db2777','#7c3aed','#0891b2','#ca8a04'];
function tlHue(role){
  let h=0; const s=String(role||'—');
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return TL_HUES[h%TL_HUES.length];
}
function tlMins(hhmm){ const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||''); return m?(+m[1]*60 + +m[2]):null; }
function tlFmt(mins){
  const h=Math.floor(mins/60), m=Math.round(mins%60);
  const ap=h>=12?'PM':'AM', hh=((h+11)%12)+1;
  return hh+(m?':'+String(m).padStart(2,'0'):'')+ap;
}
function tlDur(m){ const h=Math.floor(m/60), mm=Math.round(m%60); return (h?h+'h ':'')+((mm||!h)?mm+'m':''); }
const TL_DAYS=[['sun','Sun'],['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat']];
// Hours are kept per weekday: {Daniel:{mon:{start,end},sat:{off:true},…}}.
// The old single start/end format is still understood and treated as every day.
function tlSchedFor(name){
  const w=workerHours[name];
  if(!w) return null;
  if(w.start||w.end){                       // legacy flat format
    const s={}; TL_DAYS.forEach(([k])=>{ s[k]={start:w.start,end:w.end}; });
    return s;
  }
  return w;
}
function tlHoursFor(name, dateObj){
  const d=dateObj||tlDate;
  const key=TL_DAYS[d.getDay()][0];
  const sched=tlSchedFor(name)||{};
  const day=sched[key]||{};
  if(day.off) return { start:0, end:0, off:true };
  const s=tlMins(day.start), e=tlMins(day.end);
  return { start: s===null?tlMins(TL_DEFAULT.start):s, end: e===null?tlMins(TL_DEFAULT.end):e, off:false };
}

  t.style.top =(y-h-14 < 8 ? y+18 : y-h-14)+'px';
  clearTimeout(t._hide);
  if(ev.touches||ev.type==='click') t._hide=setTimeout(()=>{t.style.display='none';},2600);
}

async function renderTimelinePage(){
